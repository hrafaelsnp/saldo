                mesFim: effectiveOf,
                seriesId,
              });
              await state.db.doc(collList + "/" + id).update(doc);
              await syncShareMirror(collList, id, doc);
            }
            if (sibling) {
              await deleteShareMirror(collList, sibling);
              await state.db.doc(collList + "/" + sibling.id).delete();
            }
            return;
          }
          const isSingleMonth = oi === monthKey && of === monthKey;
          if (isSingleMonth) {
            const doc = Object.assign({}, item, newFields, { seriesId });
            await state.db.doc(collList + "/" + id).update(doc);
            await syncShareMirror(collList, id, doc);
            return;
          }
          const needsAfter = of === null || of > monthKey;
          if (needsBefore) {
            const beforeDoc = Object.assign({}, item, seriesFields, {
              mesFim: addMonths(monthKey, -1),
            });
            await state.db.doc(collList + "/" + id).update(beforeDoc);
            await syncShareMirror(collList, id, beforeDoc);
            if (needsAfter) {
              const afterDoc = Object.assign({}, oldValueFields, seriesFields, {
                mesInicio: addMonths(monthKey, 1),
                mesFim: of,
              });
              const ref = await state.db.collection(collList).add(afterDoc);
              await syncShareMirror(collList, ref.id, afterDoc);
            }
            const onlyDoc = Object.assign({}, newFields, {
              mesInicio: monthKey,
              mesFim: monthKey,
              seriesId,
            });
            const onlyRef = await state.db.collection(collList).add(onlyDoc);
            await syncShareMirror(collList, onlyRef.id, onlyDoc);
          } else if (needsAfter) {
            // oi === monthKey: não há trecho "antes" — reaproveita o próprio
            // registro original como o trecho "depois" (ele já tem o valor antigo).
            const afterDoc = Object.assign({}, item, seriesFields, {
              mesInicio: addMonths(monthKey, 1),
            });
            await state.db.doc(collList + "/" + id).update(afterDoc);
            await syncShareMirror(collList, id, afterDoc);
            const onlyDoc = Object.assign({}, newFields, {
              mesInicio: monthKey,
              mesFim: monthKey,
              seriesId,
            });
            const onlyRef = await state.db.collection(collList).add(onlyDoc);
            await syncShareMirror(collList, onlyRef.id, onlyDoc);
          } else {
            const doc = Object.assign({}, item, newFields, { seriesId });
            await state.db.doc(collList + "/" + id).update(doc);
            await syncShareMirror(collList, id, doc);
          }
        }

        /* ============================================================
     2. Regras derivadas da planilha
  ============================================================ */
        function fixedApplies(item, key) {
          if (item.mesInicio && key < item.mesInicio) return false;
          if (item.mesFim && key > item.mesFim) return false;
          return true;
        }
        function installmentInfo(item, key) {
          const n = monthDiff(item.mesInicio, key) + 1;
          const total = Number(item.totalParcelas) || 1;
          if (n < 1 || n > total) return null;
          return { atual: n, total };
        }
        // Lançamento de cartão recorrente (ex.: assinatura, mensalidade) — não
        // tem qtd. de parcelas, vale todo mês a partir do "1ª parcela em" pra
        // sempre (mesma ideia de fixedApplies, sem data de fim). Lançamentos
        // sem o campo "recorrente" (todos os antigos) continuam do jeito de
        // sempre: contados por parcela via installmentInfo.
        function cardTxInfo(item, key) {
          if (item.recorrente) {
            return fixedApplies(item, key) ? { atual: null, total: null } : null;
          }
          return installmentInfo(item, key);
        }
        // Um parcelamento fica "quitado" quando o número da parcela já passou do
        // total (diferente de "ainda não iniciado", que é antes da 1ª parcela) —
        // usado para sumir da tabela quando já foi pago por completo, mas continuar
        // visível enquanto ainda não começou (parcelamento futuro já cadastrado).
        function isQuitadoParcela(item, key) {
          const total = Number(item.totalParcelas) || 1;
          const n = monthDiff(item.mesInicio, key) + 1;
          return n > total;
        }
        // "Outros" (contribuições de terceiros nas receitas) aceita a mesma regra de
        // parcelamento dos cartões/parcelamentos (valor da parcela + qtd. parcelas + mês da
        // 1ª parcela, com contador automático). Lançamentos antigos sem totalParcelas
        // continuam recorrentes para sempre a partir do mês de início, para não quebrar
        // dados já cadastrados.
        function incomeOtherInfo(item, key) {
          if (item.totalParcelas) return installmentInfo(item, key);
          return fixedApplies(item, key) ? { atual: null, total: null } : null;
        }
        function groupByPessoa(items) {
          const byP = new Map();
          items.forEach((i) => {
            const p = i.pessoa || "—";
            if (!byP.has(p)) byP.set(p, []);
            byP.get(p).push(i);
          });
          return [...byP.entries()].map(([pessoa, itens]) => ({
            pessoa,
            itens,
            total: itens.reduce((s, i) => s + (Number(i.valor) || 0), 0),
          }));
        }
        // Resumo do mês: uma pessoa pode aparecer em "Terceiros" das receitas
        // (contribuições que ela dá, ex.: parte da gasolina), das despesas fixas
        // (contas que Rafael paga por ela e ela ressarce) e dos parcelamentos
        // (mesma ideia, parcelado — inclusive lançamentos espelhados de um
        // Compartilhamento) — em vez de grupos separados por pessoa, junta os
        // três num só, com o saldo líquido dela no mês.
        function mergeTerceirosByPessoa(incomeGroups, fixedGroups, instGroups) {
          const byP = new Map();
          const ensure = (pessoa) => {
            if (!byP.has(pessoa))
              byP.set(pessoa, {
                pessoa,
                incomeItens: [],
                fixedItens: [],
                instItens: [],
              });
            return byP.get(pessoa);
          };
          incomeGroups.forEach((g) => {
            ensure(g.pessoa).incomeItens = g.itens;
          });
          fixedGroups.forEach((g) => {
            ensure(g.pessoa).fixedItens = g.itens;
          });
          (instGroups || []).forEach((g) => {
            ensure(g.pessoa).instItens = g.itens;
          });
          return [...byP.values()];
        }
        // Grupos por pessoa nas tabelas de Terceiros (Receitas e Despesas fixas):
        // recolhido por padrão, expande com clique no cabeçalho de cada pessoa.
        function isPessoaGroupOpen(key) {
          return state.pessoaGroupOpen[key] === true;
        }

        function monthCompute(key) {
          // Entradas: receita própria (salário, ticket, auxílio...) + "Outros" — contribuições
          // de terceiros (Claudia, Fred, Relviski...), que na planilha é a soma de uma
          // sub-tabela por pessoa, não um valor solto.
          const incomeOwn = state.income.filter(
            (i) => !i.pessoa && fixedApplies(i, key),
          );
          const incomeOther = state.income.filter(
            (i) => i.pessoa && incomeOtherInfo(i, key),
          );
          const incomeOtherByPessoa = groupByPessoa(incomeOther);
          const totalIncomeOwn = incomeOwn.reduce(
            (s, i) => s + (Number(i.valor) || 0),
            0,
          );
          const totalIncomeOther = incomeOther.reduce(
            (s, i) => s + (Number(i.valor) || 0),
            0,
          );
          const totalIncome = totalIncomeOwn + totalIncomeOther;

          // Saídas — despesas fixas próprias x despesas de "Terceiros" (contas pagas por
          // Rafael mas referentes/a ressarcir por outra pessoa, ex.: "Papai"). Na planilha
          // são duas tabelas separadas que alimentam linhas diferentes da coluna de saídas.
          const fixedAll = state.fixed.filter((i) => fixedApplies(i, key));
          const fixedOwn = fixedAll.filter((i) => !i.pessoa);
          const fixedThird = fixedAll.filter((i) => i.pessoa);
          const fixedThirdByPessoa = groupByPessoa(fixedThird);
          const totalFixed = fixedOwn.reduce(
            (s, i) => s + (Number(i.valor) || 0),
            0,
          );
          const totalThirdParty = fixedThird.reduce(
            (s, i) => s + (Number(i.valor) || 0),
            0,
          );

          const instItems = state.installments
            .map((i) => ({ item: i, info: installmentInfo(i, key) }))
            .filter((x) => x.info);
          const totalInst = instItems.reduce(
            (s, x) => s + (Number(x.item.valorParcela) || 0),
            0,
          );
          // Parcelamento com Terceiro (ex.: espelhado de um compartilhamento) —
          // separa dos parcelamentos próprios pra poder agrupar por pessoa no
          // Resumo do mês, junto com Despesas fixas/Receitas de Terceiro (ver
          // mergeTerceirosByPessoa). Não muda totalInst: soma tudo igual antes.
          const instOwn = instItems.filter((x) => !x.item.pessoa);
          const instThird = instItems.filter((x) => x.item.pessoa);
          const instThirdByPessoa = groupByPessoa(
            instThird.map((x) =>
              Object.assign({}, x.item, { valor: x.item.valorParcela, __info: x.info }),
            ),
          );

          // Cartões — cada cartão tem seu próprio lançamento de compras (fatura) por mês.
          // Cada lançamento segue a mesma regra dos parcelamentos: valor da parcela + quantidade
          // de parcelas + mês da 1ª parcela, e o app calcula sozinho em quais meses ele aparece
          // e qual é a parcela atual — sem precisar redigitar "8/10" todo mês.
          const cardsMonth = state.cards.map((c) => {
            const txs = state.cardTx
              .filter((t) => t.cardId === c.id)
              .map((t) => ({ tx: t, info: cardTxInfo(t, key) }))
              .filter((x) => x.info);
            const total = txs.reduce(
              (s, x) => s + (Number(x.tx.valorParcela) || 0),
              0,
            );
            return { card: c, txs, total };
          });
          const cardsWithTx = cardsMonth.filter((c) => c.txs.length > 0);
          const totalCards = cardsMonth.reduce((s, c) => s + c.total, 0);

          const pagamentos = state.monthDoc.pagamentos || {};

          // Provisão: valor mensal reservado por lançamento (ex.: "Gasolina" =
          // R$1.400). Todo lançamento de saída (despesa fixa, parcelamento ou
          // cartão) com o MESMO nome desconta desse valor no mês em que ocorre
          // — nunca passa de zero, e cada mês recomeça no valor provisionado
          // configurado (não acumula sobra/dívida de um mês pro outro). O que
          // SOBRA (restante) entra nas saídas como se fosse mais uma despesa
          // própria — assim o total do mês sempre reflete o valor provisionado
          // inteiro (parte já como o gasto real que bateu com o nome, parte
          // como a reserva que ainda não foi usada), sem contar o mesmo
          // lançamento duas vezes.
          const normNome = (s) => String(s || "").trim().toLowerCase();
          const saidasDoMes = [
            ...fixedOwn.map((i) => ({ nome: i.nome, valor: Number(i.valor) || 0 })),
            ...fixedThird.map((i) => ({ nome: i.nome, valor: Number(i.valor) || 0 })),
            ...instItems.map((x) => ({
              nome: x.item.nome,
              valor: Number(x.item.valorParcela) || 0,
            })),
            ...cardsMonth.flatMap((cm) =>
              cm.txs.map((t) => ({
                nome: t.tx.descricao,
                valor: Number(t.tx.valorParcela) || 0,
              })),
            ),
          ];
          const provisionsMonth = state.provisions
            .filter((p) => fixedApplies(p, key))
            .map((p) => {
              const consumido = saidasDoMes
                .filter((s) => normNome(s.nome) === normNome(p.nome))
                .reduce((sum, s) => sum + s.valor, 0);
              const restante = Math.max(0, (Number(p.valor) || 0) - consumido);
              return { item: p, consumido, restante };
            });
          const totalProvisoes = provisionsMonth.reduce(
            (s, p) => s + p.restante,
            0,
          );

          const payable = [
            ...fixedOwn.map((i) => ({ id: i.id, valor: Number(i.valor) || 0 })),
            ...instOwn.map((x) => ({
              id: x.item.id,
              valor: Number(x.item.valorParcela) || 0,
            })),
            ...cardsWithTx.map((c) => ({
              id: "card:" + c.card.id,
              valor: c.total,
            })),
            ...provisionsMonth.map((p) => ({
              id: p.item.id,
              valor: p.restante,
            })),
          ];
          const pendente = payable.filter((p) => !pagamentos[p.id]);
          // Terceiro (Resumo do mês agrupa receita + despesa fixa + parcelamento
          // da mesma pessoa, ver mergeTerceirosByPessoa): em vez de somar cada
          // despesa dela separada (ignorando o que ela te deve), soma só o que
          // ainda está em aberto dos dois lados (não marcado como
          // pago/recebido) e usa o LÍQUIDO — se ainda sobra negativo (você
          // deve mais que ela), essa diferença é o que entra em "Falta pagar";
          // se zerar ou virar positivo (ela te deve mais), não falta pagar
          // nada pra ela (vira "a receber", que não é o que este total mede).
          const terceirosMerged = mergeTerceirosByPessoa(
            incomeOtherByPessoa,
            fixedThirdByPessoa,
            instThirdByPessoa,
          );
          let terceirosPendente = 0;
          terceirosMerged.forEach((m) => {
            const unpaid = (itens) =>
              itens
                .filter((i) => !pagamentos[i.id])
                .reduce((s, i) => s + (Number(i.valor) || 0), 0);
            const net =
              unpaid(m.incomeItens) - unpaid(m.fixedItens) - unpaid(m.instItens);
            if (net < 0) terceirosPendente += -net;
          });
          const totalPendente =
            pendente.reduce((s, p) => s + p.valor, 0) + terceirosPendente;

          const totalSaidas =
            totalFixed +
            totalInst +
            totalThirdParty +
            totalCards +
            totalProvisoes;
          const saldo = totalIncome - totalSaidas;

          return {
            totalIncome,
            totalIncomeOwn,
            totalIncomeOther,
            incomeOwn,
            incomeOther,
            incomeOtherByPessoa,
            totalFixed,
            totalThirdParty,
            fixedOwn,
            fixedThird,
            fixedThirdByPessoa,
            totalInst,
            instItems,
            instOwn,
            instThird,
            instThirdByPessoa,
            cardsMonth,
            cardsWithTx,
            totalCards,
            totalSaidas,
            saldo,
            totalPendente,
            provisionsMonth,
            totalProvisoes,
          };
        }

        /* ============================================================
     3. Navegação
  ============================================================ */
        const SECTIONS = [
          { id: "resumo", label: "Resumo do mês", ic: "◆" },
          { id: "receitas", label: "Receitas", ic: "↑" },
          {
            id: "despesasGrupo",
            label: "Despesas",
            ic: "↓",
            children: [
              { id: "despesas", label: "Despesas", ic: "▢" },
              { id: "parcelas", label: "Parcelamentos", ic: "⋯" },
              { id: "cartoes", label: "Cartões", ic: "▭" },
              { id: "provisao", label: "Provisão", ic: "▤" },
            ],
          },
          {
            id: "settings",
            label: "Settings",
            ic: "⚙",
            children: [
              { id: "compartilhamento", label: "Compartilhamento", ic: "⇄" },
              { id: "limpar", label: "Limpar dados", ic: "⌫" },
              { id: "conta", label: "Minha conta", ic: "⚠" },
            ],
          },
        ];
        function findSectionMeta(id) {
          for (const s of SECTIONS) {
            if (s.id === id) return s;
            if (s.children) {
              const c = s.children.find((c) => c.id === id);
              if (c) return c;
            }
          }
          return null;
        }

        // Módulos disponíveis para "Limpar dados": cada um mapeia pra uma ou mais
        // coleções do banco (Cartões cobre tanto os cartões quanto os lançamentos
        // deles — apagar um sem o outro deixaria lançamentos órfãos).
        const CLEAR_MODULES = [
          { key: "receitas", label: "Receitas", collections: ["income"] },
          {
            key: "despesas",
            label: "Despesas fixas",
            collections: ["fixedExpenses"],
          },
          {
            key: "parcelamentos",
            label: "Parcelamentos",
            collections: ["installments"],
          },
          {
            key: "cartoes",
            label: "Cartões",
            collections: ["cardTransactions", "cards"],
          },
          {
            key: "provisoes",
            label: "Provisão",
            collections: ["provisions"],
          },
          {
            key: "compartilhamento",
            label: "Compartilhamento",
            collections: ["shares"],
          },
        ];
        const clearStateKeyForColl = {
          income: "income",
          fixedExpenses: "fixed",
          installments: "installments",
          cards: "cards",
          cardTransactions: "cardTx",
          provisions: "provisions",
          shares: "shares",
        };
        // Sugestões dos campos "Nome"/"Terceiro": em vez de um cadastro separado
        // ("Nomes cadastrados", removido), usa direto o que já foi lançado em
        // cada módulo — cada valor único já digitado vira uma opção. Antes isso
        // era um <datalist> nativo (dropdown feio, sem como estilizar); agora é
        // o componente .ac-list (ver bindAutocomplete), com a mesma cara de
        // cartão/sombra do resto do app.
        function uniqSorted(values) {
          return [...new Set(values.filter(Boolean))].sort((a, b) =>
            a.localeCompare(b, "pt-BR"),
          );
        }
        const AC_SOURCES = {
          "dl-receita": () => state.income.map((i) => i.nome),
          // Campos "Lançamento" de Despesas fixas/Parcelamentos/Cartões:
          // também sugere os nomes cadastrados em Provisão — ajuda a digitar
          // EXATAMENTE igual ao que está lá, que é o que a Provisão usa pra
          // "casar" e descontar do valor provisionado (ver monthCompute).
          "dl-despesa_fixa": () => [
            ...state.fixed.map((i) => i.nome),
            ...state.provisions.map((p) => p.nome),
          ],
          "dl-parcelamento": () => [
            ...state.installments.map((i) => i.nome),
            ...state.provisions.map((p) => p.nome),
          ],
          "dl-cartoes": () => [
            ...state.cardTx.map((t) => t.descricao),
            ...state.provisions.map((p) => p.nome),
          ],
          // Campos "Terceiro": além dos nomes já usados no próprio módulo,
          // sempre inclui os nomes cadastrados em Settings > Compartilhamento
          // — ajuda a digitar EXATAMENTE igual ao que está lá, que é o que o
          // espelhamento usa pra "casar" um lançamento com o compartilhamento
          // (ver syncShareMirror/findShareEmail).
          "dl-pessoa-receita": () => [
            ...state.income.map((i) => i.pessoa),
            ...state.shares.map((s) => s.terceiro),
          ],
          "dl-pessoa-despesa": () => [
            ...state.fixed.map((i) => i.pessoa),
            ...state.shares.map((s) => s.terceiro),
          ],
          "dl-pessoa-parcelamento": () => [
            ...state.installments.map((i) => i.pessoa),
            ...state.shares.map((s) => s.terceiro),
          ],
          // Provisão desconta de qualquer saída com o MESMO nome — sugere os
          // nomes já usados em despesas fixas, parcelamentos e cartões, pra
          // ajudar a escrever igual e a provisão realmente "casar".
          "dl-provisao-lancamento": () => [
            ...state.fixed.map((i) => i.nome),
            ...state.installments.map((i) => i.nome),
            ...state.cardTx.map((t) => t.descricao),
          ],
        };
        // Autocomplete customizado: substitui o <input list="..."> nativo (cujo
        // dropdown o navegador desenha do jeito dele, sem dar pra estilizar) por
        // uma lista própria (.ac-list) no mesmo estilo visual do resto do app.
        // Um ÚNICO elemento compartilhado (criado uma vez, fora do ciclo de
        // renderização) em vez de um por campo: como as telas inteiras são
        // recriadas (wrap.innerHTML = ...) a cada renderViews(), um <div>
        // anexado dentro do campo se perderia (ou vazaria, se anexado fora)
        // toda hora. Fica em document.body com position:fixed, posicionado via
        // getBoundingClientRect() do campo focado — assim escapa do
        // overflow:hidden dos .card (usado pra arredondar as tabelas), que
        // cortava um dropdown position:absolute normal.
        const acList = document.createElement("div");
        acList.className = "ac-list";
        acList.hidden = true;
        document.body.appendChild(acList);
        let acInput = null;
        let acActive = -1;
        function acPosition() {
          if (!acInput) return;
          const r = acInput.getBoundingClientRect();
          acList.style.left = r.left + "px";
          acList.style.top = r.bottom + 4 + "px";
          acList.style.width = r.width + "px";
        }
        function acClose() {
          acList.hidden = true;
          acInput = null;
        }
        function acRender(input, getSource) {
          const q = input.value.trim().toLowerCase();
          // Só mostra sugestão depois de pelo menos 2 letras digitadas — antes
          // disso a lista (tudo que já foi usado, sem filtro nenhum) é grande
          // demais pra ser útil; assim só aparece o que é necessário pro que
          // está sendo digitado.
          if (q.length < 2) {
            acClose();
            return;
          }
          const values = uniqSorted(getSource());
          const items = values
            .filter((v) => v.toLowerCase().includes(q))
            .slice(0, 8);
          if (!items.length) {
            acClose();
            return;
          }
          acInput = input;
          acPosition();
          acList.innerHTML = items
            .map(
              (v, idx) =>
                `<div class="ac-item${idx === acActive ? " active" : ""}" data-val="${esc(v)}">${esc(v)}</div>`,
            )
            .join("");
          acList.hidden = false;
        }
        acList.addEventListener("mousedown", (e) => {
          const item = e.target.closest(".ac-item");
          if (!item || !acInput) return;
          e.preventDefault();
          acInput.value = item.dataset.val;
          acClose();
        });
        window.addEventListener(
          "scroll",
          () => {
            if (!acList.hidden) acClose();
          },
          true,
        );
        window.addEventListener("resize", () => {
          if (!acList.hidden) acPosition();
        });

        function bindAutocomplete(root) {
          root.querySelectorAll("input[data-ac]").forEach((input) => {
            const getSource = AC_SOURCES[input.dataset.ac];
            if (!getSource) return;
            input.addEventListener("input", () => {
              acActive = -1;
              acRender(input, getSource);
            });
            input.addEventListener("focus", () => {
              acActive = -1;
              acRender(input, getSource);
            });
            input.addEventListener("keydown", (e) => {
              if (acList.hidden || acInput !== input) return;
              const items = [...acList.children];
              if (e.key === "ArrowDown") {
                e.preventDefault();
                acActive = Math.min(items.length - 1, acActive + 1);
                acRender(input, getSource);
              } else if (e.key === "ArrowUp") {
                e.preventDefault();
                acActive = Math.max(0, acActive - 1);
                acRender(input, getSource);
              } else if (e.key === "Enter") {
                if (acActive >= 0 && items[acActive]) {
                  e.preventDefault();
                  input.value = items[acActive].dataset.val;
                  acClose();
                }
              } else if (e.key === "Escape") {
                acClose();
              }
            });
            input.addEventListener("blur", () => {
              setTimeout(() => {
                if (acInput === input) acClose();
              }, 120);
            });
          });
        }

        function renderNav() {
          const nav = document.getElementById("sectionNav");
          nav.innerHTML = SECTIONS.map((s) => {
            if (s.children) {
              // Recolhido por padrão (só abre com o clique, ou automaticamente
              // quando um dos itens dele é o que está ativo). A seta fica grudada
              // na direita via margin-left:auto — ícone+texto ficam alinhados à
              // esquerda igual aos demais itens do menu, sem "empurrar" o texto
              // para o centro.
              // Grupos com view própria (ex.: Despesas fixas) navegam pra ela E
              // alternam o submenu ao clicar — grupos sem view própria (ex.:
              // Settings) só abrem/fecham, sem navegar pra lugar nenhum. Abre
              // sozinho quando um FILHO está ativo (childActive); estar na
              // própria seção (selfActive) NÃO força abertura — senão nunca
              // dava pra recolher de novo depois de entrar em "Despesas fixas".
              const childActive = s.children.some(
                (c) => c.id === state.section,
              );
              const selfActive = s.id === state.section;
              const isOpen = !!state.navOpen[s.id] || childActive;
              return `
          <button class="nav-btn nav-group${childActive || selfActive ? " active" : ""}" data-navgroup="${s.id}">
            <span class="ic">${s.ic}</span>${s.label}<span class="nav-caret">${isOpen ? "▾" : "▸"}</span>
          </button>
          <div class="nav-children" ${isOpen ? "" : "hidden"}>
            ${s.children.map((c) => `<button class="nav-btn nav-child${c.id === state.section ? " active" : ""}" data-sec="${c.id}"><span class="ic">${c.ic}</span>${c.label}</button>`).join("")}
          </div>`;
            }
            return `<button class="nav-btn${s.id === state.section ? " active" : ""}" data-sec="${s.id}"><span class="ic">${s.ic}</span>${s.label}</button>`;
          }).join("");
          nav.querySelectorAll("[data-sec]").forEach((b) =>
            b.addEventListener("click", () => {
              state.section = b.dataset.sec;
              renderAll();
            }),
          );
          nav.querySelectorAll("[data-navgroup]").forEach((b) =>
            b.addEventListener("click", () => {
              const id = b.dataset.navgroup;
              state.navOpen[id] = !state.navOpen[id];
              if (VIEWS[id]) {
                state.section = id;
                renderAll();
              } else {
                renderNav();
              }
            }),
          );
        }

        function renderTopbar() {
          document.getElementById("monthLabel").textContent = monthLabel(
            state.month,
          );
          const sec = findSectionMeta(state.section);
          document.getElementById("viewCaption").textContent = sec
            ? sec.label
            : "";
        }

        function renderTiles() {
          const c = monthCompute(state.month);
          const tiles = document.getElementById("tiles");
          tiles.innerHTML = `
      <div class="tile good"><div class="label">Entradas</div><div class="value">${money(c.totalIncome)}</div><div class="sub">própria ${money(c.totalIncomeOwn)} · terceiros ${money(c.totalIncomeOther)}</div></div>
      <div class="tile bad"><div class="label">Saídas</div><div class="value">${money(c.totalSaidas)}</div><div class="sub">fixas ${money(c.totalFixed)} · parcelas ${money(c.totalInst)} · terceiros ${money(c.totalThirdParty)} · cartões ${money(c.totalCards)} · provisão ${money(c.totalProvisoes)}</div></div>
      <div class="tile ${c.saldo >= 0 ? "good" : "bad"}"><div class="label">Saldo do mês</div><div class="value">${money(c.saldo)}</div><div class="sub">entradas − saídas</div></div>
      <div class="tile ${c.totalPendente > 0 ? "bad" : "good"}"><div class="label">Falta pagar</div><div class="value">${money(c.totalPendente)}</div><div class="sub">contas pendentes no mês</div></div>
    `;
        }

        /* ============================================================
     4. Seções
  ============================================================ */
        // Para telas com mais de um tipo de quadro de lançamento (ex.: Receitas tem
        // "Receita própria" e "Outros"; Despesas fixas tem "Despesas próprias" e
        // "Terceiros"): em vez de empilhar os quadros um embaixo do outro, mostra
        // uma barra de abas e só o quadro da aba ativa. `groupKey` identifica a
        // barra (guarda a aba ativa em state.tabs[groupKey]); `tabs` é
        // [{key,label,count}]; a 1ª aba é o padrão se nada foi escolhido ainda.
        function tabBar(groupKey, tabs) {
          const active = state.tabs[groupKey] || tabs[0].key;
          return {
            active,
            html: `
      <div class="tabbar" data-tabgroup="${groupKey}">
        ${tabs.map((t) => `<button class="tab-btn${t.key === active ? " active" : ""}" data-tabkey="${t.key}">${esc(t.label)}${t.count != null ? ` <span class="tab-count">${t.count}</span>` : ""}</button>`).join("")}
      </div>`,
          };
        }
        function payChip(id) {
          const on = !!(
            state.monthDoc.pagamentos && state.monthDoc.pagamentos[id]
          );
          return `<button class="pay-toggle ${on ? "on" : "off"}" data-pay="${id}">${on ? "pago" : "pendente"}</button>`;
        }
        // Para entradas: mesmo mapa de "pagamentos" do payChip — por padrão (nada marcado)
        // a entrada começa como "a receber"; marcar diz que já foi recebida. É só uma
        // etiqueta informativa: não entra em nenhum total do dashboard (só as saídas
        // alimentam "Falta pagar").
        function receivedChip(id) {
          const on = !!(
            state.monthDoc.pagamentos && state.monthDoc.pagamentos[id]
          );
          return `<button class="pay-toggle ${on ? "on" : "off"}" data-pay="${id}">${on ? "recebido" : "a receber"}</button>`;
        }
        // Botão de status agregado para o cabeçalho de um grupo (ex.: todas as contas de
        // "Claudia" em Terceiros, ou todas as contribuições de "Claudia" em Outros): clicar
        // alterna TODOS os itens do grupo de uma vez, para o botão continuar funcional
        // mesmo com o grupo recolhido — não é preciso expandir para mudar o status.
        function groupStatusChip(ids, trueLabel, falseLabel) {
          if (!ids.length) return "";
          const allOn = ids.every(
            (id) =>
              !!(state.monthDoc.pagamentos && state.monthDoc.pagamentos[id]),
          );
          return `<button class="pay-toggle ${allOn ? "on" : "off"}" data-paygroup="${ids.join(",")}">${allOn ? trueLabel : falseLabel}</button>`;
        }
        function situacaoChip(tx) {
          const verificado = tx.situacao === "verificado";
          return `<button class="pay-toggle ${verificado ? "on" : "off"}" data-situacao="${tx.id}">${verificado ? "verificado" : "aguardando"}</button>`;
        }
        function isEditing(coll, id) {
          return !!(
            state.editing &&
            state.editing.coll === coll &&
            state.editing.id === id
          );
        }
        function cancelBtn() {
          return `<button class="add" type="button" data-canceledit style="background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);">Cancelar</button>`;
        }
        // Lançamento espelhado de um Compartilhamento (mirroredFrom foi gravado
        // pelo mirror_write, do lado de quem recebeu): quem recebe só acompanha,
        // não edita nem exclui — quem controla é a conta que compartilhou. Troca
        // os botões de ação por um selo indicando a origem.
        function rowActions(editAttr, delAttr, item) {
          if (item && item.mirroredFrom) {
            return `<span class="chip fase" title="Lançamento recebido por compartilhamento — só quem compartilhou pode editar ou excluir">compartilhado</span>`;
          }
          return `<div class="row-actions"><button class="icon-btn" data-editrow="${editAttr}" title="Editar">✎</button><button class="icon-btn" data-del="${delAttr}" title="Remover">✕</button></div>`;
        }
        // Escolha de alcance ao editar um valor já lançado: só o mês em exibição, ou
        // esse mês e os que vêm depois (já lançados). Usado nos formulários de
        // edição de despesas fixas/terceiros e receita própria/outros recorrentes —
        // não se aplica a parcelamentos (cartão, Parcelamentos, Outros parcelado).
        function editScopeRadios() {
          return `
      <div class="field field-check" style="flex:1 1 320px; min-width:300px; flex-direction:row; gap:18px; align-items:center; justify-content:flex-start;">
        <label class="check-row" style="white-space:nowrap;"><input type="radio" name="editScope" value="only" checked><span>Só este mês</span></label>
        <label class="check-row" style="white-space:nowrap;"><input type="radio" name="editScope" value="forward"><span>Este mês em diante</span></label>
      </div>`;
        }

        function viewResumo() {
          const c = monthCompute(state.month);
          const leaf = (tipo, nome, valor, sign, id) => ({
            kind: "leaf",
            tipo,
            nome,
            cat: null,
            valor,
            sign,
            id,
          });
          const group = (key, tipo, nome, cat, valor, sign, id, children) => ({
            kind: "group",
            key,
            tipo,
            nome,
            cat,
            valor,
            sign,
            id,
            children,
          });

          const entries = [
            ...c.incomeOwn.map((i) =>
              leaf("Receita", i.nome, i.valor, 1, i.id),
            ),
            ...c.fixedOwn.map((i) => leaf("Fixa", i.nome, -i.valor, -1, i.id)),
            ...c.provisionsMonth.map((p) =>
              leaf("Provisão", p.item.nome, -p.restante, -1, p.item.id),
            ),
            ...mergeTerceirosByPessoa(
              c.incomeOtherByPessoa,
              c.fixedThirdByPessoa,
              c.instThirdByPessoa,
            ).map((m) => {
              const incomeChildren = m.incomeItens.map((i) => {
                const info = i.totalParcelas
                  ? installmentInfo(i, state.month)
                  : null;
                return {
                  nome: i.nome + (info ? ` (${info.atual}/${info.total})` : ""),
                  valor: i.valor,
                  sign: 1,
                  chip: receivedChip(i.id),
                  id: i.id,
                };
              });
              const fixedChildren = m.fixedItens.map((i) => ({
                nome: i.nome,
                valor: -i.valor,
                sign: -1,
                chip: payChip(i.id),
                id: i.id,
              }));
              const instChildren = m.instItens.map((i) => {
                const info = i.__info;
                return {
                  nome: i.nome + (info ? ` (${info.atual}/${info.total})` : ""),
                  valor: -i.valor,
                  sign: -1,
                  chip: payChip(i.id),
                  id: i.id,
                };
              });
              const children = [
                ...incomeChildren,
                ...fixedChildren,
                ...instChildren,
              ];
              const total = children.reduce((s, ch) => s + ch.valor, 0);
              return group(
                "terceiros:" + m.pessoa,
                "Terceiros",
                m.pessoa,
                null,
                total,
                total >= 0 ? 1 : -1,
                null,
                children,
              );
            }),
            ...c.instOwn.map((x) =>
              leaf(
                "Parcela",
                x.item.nome + ` (${x.info.atual}/${x.info.total})`,
                -x.item.valorParcela,
                -1,
                x.item.id,
              ),
            ),
            ...c.cardsWithTx.map((x) =>
              group(
                "card:" + x.card.id,
                "Cartão",
                x.card.nome,
                `${x.txs.length} lançamento${x.txs.length === 1 ? "" : "s"}`,
                -x.total,
                -1,
                "card:" + x.card.id,
                x.txs.map((t) => ({
                  nome: t.tx.descricao + ` (${t.info.atual}/${t.info.total})`,
                  valor: -t.tx.valorParcela,
                  sign: -1,
                  chip: situacaoChip(t.tx),
                })),
              ),
            ),
          ];

          // Entradas usam o chip recebido/a receber; saídas usam pago/pendente. É só uma
          // etiqueta informativa por lançamento — não altera nenhum total do dashboard.
          const chipFor = (e) =>
            e.sign > 0 ? receivedChip(e.id) : payChip(e.id);
          // Grupo "Terceiros" não tem uma chave de pagamento única (cada item tem a
          // sua, e agora mistura contribuições recebidas com despesas pagas por
          // essa pessoa) — por isso o cabeçalho do grupo mostra um resumo de cada
          // lado calculado a partir dos filhos (sign>0 = contribuição, sign<0 =
          // despesa paga por conta dela).
          const groupChip = (e) => {
            if (e.tipo === "Terceiros") {
              const incomeIds = e.children
                .filter((ch) => ch.sign > 0)
                .map((ch) => ch.id)
                .filter(Boolean);
              const fixedIds = e.children
                .filter((ch) => ch.sign < 0)
                .map((ch) => ch.id)
                .filter(Boolean);
              if (incomeIds.length && fixedIds.length) {
                // Grupo misto (tem receita e despesa/parcelamento da mesma
                // pessoa): em vez de dois botões (um recebido/a receber, outro
                // pago/pendente), mostra um único, que resume o saldo líquido
                // dela no mês — negativo é "pendente" (você ainda deve pra
                // ela), positivo (ou zero) é "a receber" (ela ainda te deve).
                // Continua clicável: alterna TODOS os itens do grupo de uma vez
                // (receita e despesa juntas), igual os botões normais.
                const allIds = [...incomeIds, ...fixedIds];
                return e.valor >= 0
                  ? groupStatusChip(allIds, "recebido", "a receber")
                  : groupStatusChip(allIds, "pago", "pendente");
              }
              return [
                groupStatusChip(incomeIds, "recebido", "a receber"),
                groupStatusChip(fixedIds, "pago", "pendente"),
              ]
                .filter(Boolean)
                .join(" ");
            }
            return chipFor(e);
          };

          const body = entries.length
            ? entries
                .map((e) => {
                  if (e.kind === "leaf") {
                    return `
      <tr>
        <td><span class="row-name">${esc(e.nome)}</span><div class="row-cat">${esc(e.tipo)}</div></td>
        <td class="num" style="color:${e.sign > 0 ? "var(--good)" : "var(--bad)"}">${money(e.valor)}</td>
        <td>${chipFor(e)}</td>
      </tr>`;
                  }
                  const isOpen = !!state.resumoOpen[e.key];
                  const header = `
      <tr class="group-header">
        <td><button class="group-toggle" data-resumogroup="${esc(e.key)}"><span class="caret">${isOpen ? "▾" : "▸"}</span><span class="row-name">${esc(e.nome)}</span></button><div class="row-cat">${esc(e.tipo)}${e.cat ? " · " + esc(e.cat) : ""}</div></td>
        <td class="num" style="color:${e.sign > 0 ? "var(--good)" : "var(--bad)"}">${money(e.valor)}</td>
        <td>${groupChip(e)}</td>
      </tr>`;
                  const children = isOpen
                    ? e.children
                        .map(
                          (ch) => `
      <tr class="group-child">
        <td><span class="row-name">${esc(ch.nome)}</span></td>
        <td class="num" style="color:${ch.sign > 0 ? "var(--good)" : "var(--bad)"}">${money(ch.valor)}</td>
        <td>${ch.chip || ""}</td>
      </tr>`,
                        )
                        .join("")
                    : "";
                  return header + children;
                })
                .join("")
            : `<tr><td colspan="3"><div class="empty"><b>Nada lançado ainda para ${monthLabel(state.month)}</b>Cadastre receitas, despesas fixas ou parcelamentos nas outras seções — eles aparecem aqui automaticamente.</div></td></tr>`;

          return `
      <div class="view-head"><h2>Resumo — ${monthLabel(state.month)}</h2></div>
      <div class="card">
        <div class="card-head"><h3>Lançamentos do mês</h3><span class="meta">${entries.length} ${entries.length === 1 ? "item" : "itens"}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Item</th><th class="num">Valor</th><th>Situação</th></tr></thead>
          <tbody>${body}</tbody>
        </table></div>
      </div>`;
        }

        function incomeEditForm(i) {
          // Mês de início e recorrência não entram na edição: quem decide o recorte
          // de meses é saveFixedEditScoped, conforme a escolha "só este mês" / "este
          // mês em diante" abaixo — mudar o início/recorrência exige excluir e
          // recadastrar (igual já acontece com despesas fixas/terceiros).
          return `
    <tr>
      <td colspan="3" style="padding:0;">
        <form class="add-row js-income-form" data-editform="income" data-editid="income:${i.id}">
          <div class="field"><label>Lançamento</label><input type="text" name="nome" value="${esc(i.nome)}" placeholder="Lançamento" data-ac="dl-receita" required></div>
          <div class="field field-check"><label>Tipo</label><label class="check-row"><input type="checkbox" class="js-tipo-check" name="tipoValor" value="bruto" ${i.tipoValor === "liquido" ? "" : "checked"}><span>Salário bruto</span></label></div>
          <div class="field"><label>Valor</label><input class="money js-valor" type="text" inputmode="decimal" name="valor" value="${i.tipoValor === "liquido" ? i.valor : i.valorBruto || 0}" required></div>
          <div class="field js-dep-wrap" ${i.tipoValor === "liquido" ? "hidden" : ""}><label>Dependentes</label><input class="small js-dep-input" type="number" step="1" min="0" name="dependentes" value="${i.dependentes || 0}"></div>
          ${editScopeRadios()}
          <button class="add" type="submit">Salvar</button>
          ${cancelBtn()}
        </form>
        <div class="calc-preview js-calc-preview" hidden></div>
      </td>
    </tr>`;
        }

        function viewReceitas() {
          const rows = state.income.filter(
            (i) => !i.pessoa && fixedApplies(i, state.month),
          );
          const body = rows.length
            ? rows
                .map((i) =>
                  isEditing("income", i.id)
                    ? incomeEditForm(i)
                    : `
      <tr>
        <td><span class="row-name">${esc(i.nome)}</span><div class="row-cat">${i.recorrente ? "recorrente desde " + monthLabel(i.mesInicio) : "apenas em " + monthLabel(i.mesInicio)}${i.tipoValor === "bruto" ? ` · bruto ${money(i.valorBruto)} − INSS ${money(i.inssCalc)} − IRPF ${money(i.irpfCalc)}` : ""}</div></td>
        <td class="num" style="color:var(--good);">${money(i.valor)}</td>
        <td><div class="row-actions"><button class="icon-btn" data-editrow="income:${i.id}" title="Editar">✎</button><button class="icon-btn" data-del="income:${i.id}" title="Remover">✕</button></div></td>
      </tr>`,
                )
                .join("")
            : `<tr><td colspan="3"><div class="empty"><b>Nenhuma receita cadastrada</b>Adicione o salário líquido e outras entradas recorrentes ou pontuais.</div></td></tr>`;

          const others = state.income.filter(
            (i) =>
              i.pessoa &&
              (i.totalParcelas
                ? !isQuitadoParcela(i, state.month)
                : fixedApplies(i, state.month)),
          );
          const groups = groupByPessoa(others);
          const othersBody = groups.length
            ? groups
                .map((g) => {
                  const key = "receitas:" + g.pessoa;
                  const isOpen = isPessoaGroupOpen(key);
                  return `
      <tr style="background:var(--surface-2)">
        <td colspan="2"><button class="group-toggle" data-pessoagroup="${esc(key)}"><span class="caret">${isOpen ? "▾" : "▸"}</span><span class="row-name">${esc(g.pessoa)}</span></button></td>
        <td class="num" style="color:var(--good);">${money(g.total)}</td><td></td>
      </tr>
      ${
        isOpen
          ? g.itens
              .map((i) => {
                if (isEditing("incomeOther", i.id))
                  return `
      <tr>
        <td colspan="4" style="padding:0;">
          <form class="add-row" data-editform="incomeOther" data-editid="incomeOther:${i.id}">
            <div class="field"><label>Terceiro</label><input type="text" name="pessoa" value="${esc(i.pessoa)}" placeholder="Terceiro" data-ac="dl-pessoa-receita" required></div>
            <div class="field"><label>Lançamento</label><input type="text" name="nome" value="${esc(i.nome)}" placeholder="Lançamento" data-ac="dl-receita" required></div>
            <div class="field"><label>${i.totalParcelas ? "Valor da parcela" : "Valor"}</label><input class="money" type="text" inputmode="decimal" name="valor" value="${i.valor}" required></div>
            ${i.totalParcelas ? "" : editScopeRadios()}
            <button class="add" type="submit">Salvar</button>
            ${cancelBtn()}
          </form>
          ${i.totalParcelas ? "" : `<div class="calc-preview" style="margin:0 16px 14px;">"Só este mês" altera apenas ${monthLabel(state.month)}; "este mês em diante" também muda os meses seguintes já lançados.</div>`}
        </td>
      </tr>`;
                const hasParcelas = !!i.totalParcelas;
                const info = hasParcelas
                  ? installmentInfo(i, state.month)
                  : null;
                const statusTxt = hasParcelas
                  ? info
                    ? `parcela ${info.atual}/${info.total}`
                    : monthDiff(i.mesInicio, state.month) < 0
                      ? "ainda não iniciado"
                      : "quitado"
                  : i.recorrente !== false
                    ? "recorrente desde " + monthLabel(i.mesInicio)
                    : "apenas em " + monthLabel(i.mesInicio);
                return `
      <tr>
        <td colspan="2"><span class="row-name">${esc(i.nome)}</span><div class="row-cat">${statusTxt}</div></td>
        <td class="num" style="color:var(--good);">${money(i.valor)}</td>
        <td>${rowActions(`incomeOther:${i.id}`, `income:${i.id}`, i)}</td>
      </tr>`;
              })
              .join("")
          : ""
      }
    `;
                })
                .join("")
            : `<tr><td colspan="4"><div class="empty"><b>Nenhuma contribuição cadastrada</b>Ex.: parte da gasolina ou do plano de saúde que a Claudia paga — some por pessoa e cai na linha "Terceiros" das entradas. Se for a parcela de uma compra dividida, informe a qtd. de parcelas e o contador avança sozinho.</div></td></tr>`;

          const propriaPanel = `
      <div class="card">
        <div class="card-head"><h3>Receita própria</h3><span class="meta">${rows.length}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Nome</th><th class="num">Valor</th><th></th></tr></thead>
          <tbody>${body}</tbody>
        </table></div>
        <form class="add-row js-income-form" data-form="income">
          <div class="field"><label>Lançamento</label><input type="text" name="nome" placeholder="Lançamento" data-ac="dl-receita" required></div>
          <div class="field field-check"><label>Tipo</label><label class="check-row"><input type="checkbox" class="js-tipo-check" name="tipoValor" value="bruto"><span>Salário bruto</span></label></div>
          <div class="field"><label>Valor</label><input class="money js-valor" type="text" inputmode="decimal" name="valor" placeholder="0,00" required></div>
          <div class="field js-dep-wrap"><label>Dependentes</label><input class="small js-dep-input" type="number" step="1" min="0" name="dependentes" placeholder="0"></div>
          <div class="field"><label>Mês de início</label><input class="month" type="month" name="mesInicio" value="${state.month}" required></div>
          <div class="field field-check"><label>Recorrente</label><label class="check-row"><input type="checkbox" name="recorrente" value="1" checked><span>Todo mês</span></label></div>
          <button class="add" type="submit">Adicionar</button>
        </form>
        <div class="calc-preview js-calc-preview" hidden></div>
      </div>`;
          const outrosPanel = `
      <div class="card">
        <div class="card-head"><h3>Terceiros</h3><span class="meta">${others.length}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th colspan="2">Terceiro / item</th><th class="num">Valor</th><th></th></tr></thead>
          <tbody>${othersBody}</tbody>
        </table></div>
        <form class="add-row js-outros-form" data-form="incomeOther">
          <div class="field"><label>Terceiro</label><input type="text" name="pessoa" placeholder="Terceiro" data-ac="dl-pessoa-receita" required></div>
          <div class="field"><label>Lançamento</label><input type="text" name="nome" placeholder="Lançamento" data-ac="dl-receita" required></div>
          <div class="field"><label class="js-valor-label">Valor</label><input class="money" type="text" inputmode="decimal" name="valor" placeholder="0,00" required></div>
          <div class="field field-check"><label>Recorrente</label><label class="check-row"><input type="checkbox" class="js-recorrente-check" name="recorrente" value="1" checked><span>Todo mês</span></label></div>
          <div class="field js-parcelas-wrap" hidden><label>Qtd. parcelas</label><input class="small" type="number" min="1" name="totalParcelas" placeholder="—"></div>
          <div class="field js-mesInicio-wrap" hidden><label>1ª parcela em</label><input class="month" type="month" name="mesInicio" value="${state.month}" required></div>
          <button class="add" type="submit">Adicionar</button>
        </form>
      </div>`;

          const tb = tabBar("receitas", [
            { key: "propria", label: "Receita própria", count: rows.length },
            { key: "outros", label: "Terceiros", count: others.length },
          ]);
          return `
      <div class="view-head"><h2>Receitas</h2></div>
      ${tb.html}
      ${tb.active === "outros" ? outrosPanel : propriaPanel}`;
        }

        function fixedEditForm(i, kind, extraField) {
          const rateio = !!i.rateio;
          return `
    <tr>
      <td colspan="3" style="padding:0;">
        <form class="add-row js-rateio-form" data-editform="${kind}" data-editid="${kind}:${i.id}">
          ${extraField ? `<div class="field"><label>Terceiro</label><input type="text" name="pessoa" value="${esc(i.pessoa)}" placeholder="Terceiro" data-ac="dl-pessoa-despesa" required></div>` : ""}
          <div class="field"><label>Lançamento</label><input type="text" name="nome" value="${esc(i.nome)}" placeholder="Lançamento" data-ac="dl-despesa_fixa" required></div>
          <div class="field"><label class="js-valor-label">${rateio ? "Valor total" : "Valor"}</label><input class="money js-valor" type="text" inputmode="decimal" name="valor" value="${rateio ? i.valorTotal : i.valor}" required></div>
          <div class="field field-check"><label>Rateio</label><label class="check-row"><input type="checkbox" class="js-rateio-check" name="rateio" value="1" ${rateio ? "checked" : ""}><span>Dividir</span></label></div>
          <div class="field js-cotasTotais-wrap" ${rateio ? "" : "hidden"}><label>Cotas Totais</label><input class="small" type="number" min="1" step="1" name="cotasTotais" value="${rateio ? i.cotasTotais : ""}"></div>
          <div class="field js-cotasPagas-wrap" ${rateio ? "" : "hidden"}><label>Minhas Cotas</label><input class="small" type="number" min="0" step="1" name="cotasPagas" value="${rateio ? i.cotasPagas : ""}"></div>
          ${editScopeRadios()}
          <button class="add" type="submit">Salvar</button>
          ${cancelBtn()}
        </form>
        <div class="calc-preview js-calc-preview" hidden></div>
        <div class="calc-preview" style="margin:0 16px 14px;">"Só este mês" altera apenas ${monthLabel(state.month)}; "este mês em diante" também muda os meses seguintes já lançados.</div>
      </td>
    </tr>`;
        }

        function fixedRangeLabel(i) {
          const base =
            i.mesFim && i.mesFim === i.mesInicio
              ? "só em " + monthLabel(i.mesInicio)
              : "desde " +
                monthLabel(i.mesInicio) +
                (i.mesFim ? " até " + monthLabel(i.mesFim) : "");
          return i.rateio
            ? base +
                " · rateio " +
                i.cotasPagas +
                "/" +
                i.cotasTotais +
                " cotas (total " +
                money(i.valorTotal) +
                ")"
            : base;
        }

        function provisaoEditForm(i) {
          return `
    <tr>
      <td colspan="3" style="padding:0;">
        <form class="add-row" data-editform="provisao" data-editid="provisao:${i.id}">
          <div class="field"><label>Lançamento</label><input type="text" name="nome" value="${esc(i.nome)}" placeholder="Lançamento" data-ac="dl-provisao-lancamento" required></div>
          <div class="field"><label>Valor Provisionado</label><input class="money" type="text" inputmode="decimal" name="valor" value="${i.valor}" required></div>
          ${editScopeRadios()}
          <button class="add" type="submit">Salvar</button>
          ${cancelBtn()}
        </form>
        <div class="calc-preview" style="margin:0 16px 14px;">"Só este mês" altera apenas ${monthLabel(state.month)}; "este mês em diante" também muda os meses seguintes já lançados.</div>
      </td>
    </tr>`;
        }

        // Linhas da tabela de Provisão (com editar/excluir) — reaproveitado tanto
        // no resumo dentro de "Despesas próprias" quanto no submenu "Provisão".
        // delScope controla o que o botão de excluir faz: "month" (usado dentro
        // de Despesas próprias) tira só o mês em exibição, sem mexer no
        // cadastro da Provisão pros demais meses; "full" (usado no submenu
        // Provisão) é a exclusão normal, que pode truncar ou apagar a série
        // inteira, igual despesa fixa/receita.
        function provisaoRowsHtml(provisoesRows, delScope) {
          const delColl = delScope === "month" ? "provisaoMes" : "provisao";
          return provisoesRows
            .map(({ item: i, consumido, restante }) =>
              isEditing("provisao", i.id)
                ? provisaoEditForm(i)
                : `
      <tr>
        <td><span class="row-name">${esc(i.nome)}</span><div class="row-cat">${fixedRangeLabel(i)} · provisionado ${money(i.valor)}${consumido > 0 ? " − " + money(consumido) + " já lançado" : ""}</div></td>
        <td class="num" style="color:${restante > 0 ? "var(--good)" : "var(--bad)"};">${money(restante)}</td>
        <td><div class="row-actions"><button class="icon-btn" data-editrow="provisao:${i.id}" title="Editar">✎</button><button class="icon-btn" data-del="${delColl}:${i.id}" title="Remover">✕</button></div></td>
      </tr>`,
            )
            .join("");
        }

        function viewDespesas() {
          const c = monthCompute(state.month);
          const rows = state.fixed.filter(
            (i) => !i.pessoa && fixedApplies(i, state.month),
          );
          const body = rows.length
            ? rows
                .map((i) =>
                  isEditing("fixed", i.id)
                    ? fixedEditForm(i, "fixed", false)
                    : `
      <tr>
        <td><span class="row-name">${esc(i.nome)}</span><div class="row-cat">${fixedRangeLabel(i)}</div></td>
        <td class="num" style="color:var(--bad);">${money(i.valor)}</td>
        <td><div class="row-actions"><button class="icon-btn" data-editrow="fixed:${i.id}" title="Editar">✎</button><button class="icon-btn" data-del="fixed:${i.id}" title="Remover">✕</button></div></td>
      </tr>`,
                )
                .join("")
            : `<tr><td colspan="3"><div class="empty"><b>Nenhuma despesa fixa</b>Ex.: luz, dízimo, plano de saúde, mensalidades — valores que se repetem todo mês.</div></td></tr>`;

          const thirds = state.fixed.filter(
            (i) => i.pessoa && fixedApplies(i, state.month),

            <button type="button" class="add" data-clearconfirm style="background:var(--bad);">Confirmar exclusão</button>

              : `
            <button type="button" class="add" data-clearstart ${anyChecked ? "" : "disabled"} style="background:${anyChecked ? "var(--bad)" : "var(--surface-2)"}; ${anyChecked ? "" : "color:var(--ink-faint); cursor:not-allowed;"}">Apagar selecionados</button>
          `
          }
        </div>
      </div>`;
        }

              <button type="button" class="add" data-delacccancel ${state.deleteAccountBusy ? "disabled" : ""} style="background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);">Cancelar</button>

        function compartilhamentoEditForm(i) {
          return `
    <tr>
      <td colspan="3" style="padding:0;">
        <form class="add-row" data-editform="compartilhamento" data-editid="compartilhamento:${i.id}">
