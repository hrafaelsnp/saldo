<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saldo+</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232957c9'/%3E%3Crect x='14' y='7' width='4' height='14' rx='2' fill='white'/%3E%3Crect x='9' y='12' width='14' height='4' rx='2' fill='white'/%3E%3Crect x='9' y='23' width='14' height='2.5' rx='1.25' fill='white' opacity='0.85'/%3E%3C/svg%3E"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --surface-2: #eef1f6;
        --ink: #1a2233;
        --ink-muted: #5f6b7d;
        --ink-faint: #98a3b3;
        --border: #e2e7ee;
        --primary: #2957c9;
        --primary-ink: #ffffff;
        --primary-soft: #e4ebfb;
        --accent: #d9713c;
        --accent-soft: #fbe8dc;
        --good: #1f9d6c;
        --good-soft: #e0f5ea;
        --warn: #c1841f;
        --warn-soft: #faedd6;
        --bad: #d1453a;
        --bad-soft: #fbe4e2;
        --shadow:
          0 1px 2px rgba(26, 34, 51, 0.04),
          0 8px 24px -12px rgba(26, 34, 51, 0.12);
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #11161f;
          --surface: #181f2b;
          --surface-2: #1f2735;
          --ink: #eef1f6;
          --ink-muted: #9aa6ba;
          --ink-faint: #68748a;
          --border: #2a3242;
          --primary: #7b9cf2;
          --primary-ink: #0e1420;
          --primary-soft: #22304e;
          --accent: #e59a6c;
          --accent-soft: #3a2a1e;
          --good: #4fc793;
          --good-soft: #173428;
          --warn: #dcaa5b;
          --warn-soft: #332711;
          --bad: #e3776c;
          --bad-soft: #3a211f;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -10px rgba(0, 0, 0, 0.6);
        }
      }
      :root[data-theme="dark"] {
        --bg: #11161f;
        --surface: #181f2b;
        --surface-2: #1f2735;
        --ink: #eef1f6;
        --ink-muted: #9aa6ba;
        --ink-faint: #68748a;
        --border: #2a3242;
        --primary: #7b9cf2;
        --primary-ink: #0e1420;
        --primary-soft: #22304e;
        --accent: #e59a6c;
        --accent-soft: #3a2a1e;
        --good: #4fc793;
        --good-soft: #173428;
        --warn: #dcaa5b;
        --warn-soft: #332711;
        --bad: #e3776c;
        --bad-soft: #3a211f;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -10px rgba(0, 0, 0, 0.6);
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3 {
        font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
        text-wrap: balance;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .mono,
      .num {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      button,
      input,
      select {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      a {
        color: inherit;
      }
      ::selection {
        background: var(--accent-soft);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        min-height: 100vh;
      }

      /* ---------- Sidebar ---------- */
      #sidebar {
        width: 232px;
        flex: none;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 20px 14px;
        gap: 18px;
      }
      .brand {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        padding: 0 6px;
      }
      .brand-icon {
        flex: 0 0 auto;
        display: block;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .brand .mark {
        font-family: "Sora", sans-serif;
        font-weight: 700;
        font-size: 19px;
        color: var(--ink);
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .brand .tag {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      nav.sections {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        border: none;
        background: none;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--ink-muted);
        font-weight: 500;
      }
      .nav-btn:hover {
        background: var(--surface-2);
        color: var(--ink);
      }
      .nav-btn.active {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 600;
      }
      .nav-btn .ic {
        width: 16px;
        text-align: center;
        opacity: 0.85;
      }
      .nav-caret {
        font-size: 10px;
        opacity: 0.6;
        margin-left: auto;
        padding-left: 8px;
      }
      .nav-children {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-left: 14px;
      }
      .nav-children[hidden] {
        display: none !important;
      }
      .nav-btn.nav-child {
        padding-left: 8px;
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 10px 6px 0;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--ink-faint);
      }
      #storeStatus {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      #storeStatus .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--good);
      }
      #storeStatus.offline .dot {
        background: var(--warn);
      }

      /* ---------- Main ---------- */
      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .month-switch {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .month-switch button {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        cursor: pointer;
        color: var(--ink-muted);
        font-size: 15px;
        line-height: 1;
      }
      .month-switch button:hover {
        background: var(--surface-2);
        color: var(--ink);
      }
      .month-label {
        font-family: "Sora", sans-serif;
        font-weight: 600;
        font-size: 17px;
        min-width: 168px;
        text-align: center;
      }
      .today-btn {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink-muted);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 12px;
      }
      .today-btn:hover {
        color: var(--ink);
        background: var(--surface-2);
      }
      .theme-toggle {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink-muted);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .theme-toggle:hover {
        color: var(--ink);
        background: var(--surface-2);
      }

      #content {
        padding: 24px 28px 60px;
        width: 100%;
      }

      /* ---------- Summary tiles ---------- */
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 26px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 16px 14px;
        box-shadow: var(--shadow);
      }
      .tile .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-faint);
        font-weight: 600;
      }
      .tile .value {
        font-size: 22px;
        font-weight: 600;
        margin-top: 6px;
      }
      .tile.good .value {
        color: var(--good);
      }
      .tile.bad .value {
        color: var(--bad);
      }
      .tile .sub {
        font-size: 11.5px;
        color: var(--ink-faint);
        margin-top: 3px;
      }

      /* ---------- Section shell ---------- */
      section.view {
        display: none;
      }
      section.view.active {
        display: block;
      }
      .view-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 4px;
        gap: 12px;
      }
      .view-head h2 {
        font-size: 19px;
      }
      .view-sub {
        color: var(--ink-muted);
        font-size: 12.5px;
        margin: 2px 0 16px;
      }

      .tabbar {
        display: inline-flex;
        flex-wrap: wrap;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
        margin: 14px 0 16px;
      }
      .tab-btn {
        border: none;
        background: none;
        padding: 7px 15px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-muted);
        font-family: "IBM Plex Sans";
        white-space: nowrap;
      }
      .tab-btn:hover {
        color: var(--ink);
      }
      .tab-btn.active {
        background: var(--primary);
        color: var(--primary-ink);
      }
      .tab-count {
        opacity: 0.8;
        font-weight: 500;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 18px;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
      }
      .card-head h3 {
        font-size: 14.5px;
        font-weight: 600;
        font-family: "IBM Plex Sans";
      }
      .card-head .meta {
        font-size: 11.5px;
        color: var(--ink-faint);
      }
      .calc-preview {
        margin: 0 16px 14px;
        padding: 9px 12px;
        background: var(--primary-soft);
        border-radius: 8px;
        font-size: 12px;
        color: var(--ink);
        font-family: "IBM Plex Mono";
      }
      .calc-preview .meta {
        font-family: "IBM Plex Sans";
        color: var(--ink-muted);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-faint);
        font-weight: 600;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      td.num,
      th.num {
        text-align: right;
        font-family: "IBM Plex Mono";
        font-variant-numeric: tabular-nums;
      }
      .row-name {
        font-weight: 500;
      }
      .row-cat {
        color: var(--ink-faint);
        font-size: 11.5px;
      }
      .table-wrap {
        overflow-x: auto;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 600;
      }
      .chip.pago {
        background: var(--good-soft);
        color: var(--good);
      }
      .chip.pendente {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .chip.fase {
        background: var(--surface-2);
        color: var(--ink-muted);
      }

      .pay-toggle {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 99px;
        padding: 4px 11px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink-muted);
      }
      .pay-toggle.on {
        background: var(--good-soft);
        color: var(--good);
        border-color: transparent;
      }
      .pay-toggle.off {
        background: var(--warn-soft);
        color: var(--warn);
        border-color: transparent;
      }
      tr.row-verificado td {
        color: var(--good);
      }
      tr.row-verificado .row-cat {
        color: var(--good);
        opacity: 0.8;
      }
      .row-actions {
        display: flex;
        gap: 2px;
        justify-content: flex-end;
      }

      .icon-btn {
        border: none;
        background: none;
        cursor: pointer;
        color: var(--ink-faint);
        padding: 4px 6px;
        border-radius: 6px;
        font-size: 13px;
      }
      .icon-btn:hover {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .group-toggle {
        border: none;
        background: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .group-toggle .caret {
        font-size: 10px;
        opacity: 0.55;
        width: 9px;
        text-align: center;
        flex: 0 0 auto;
      }
      tr.group-child td:first-child {
        padding-left: 34px;
      }
      tr.group-child .row-name {
        font-weight: 400;
        color: var(--ink-muted);
      }
      tr.group-header:hover {
        background: var(--surface-2);
      }

      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--ink-faint);
        font-size: 13px;
      }
      .empty b {
        display: block;
        color: var(--ink-muted);
        font-size: 14px;
        margin-bottom: 3px;
        font-weight: 600;
      }

      /* add row */
      .add-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        padding: 14px 16px;
        background: var(--surface-2);
        align-items: flex-end;
      }
      .add-row input,
      .add-row select {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 7px;
        padding: 7px 9px;
        color: var(--ink);
        width: 100%;
        height: 34px;
        box-sizing: border-box;
      }
      .add-row input.money,
      .add-row input.small,
      .add-row input.month {
        font-family: "IBM Plex Mono";
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .add-row button.add {
        border: none;
        background: var(--primary);
        color: var(--primary-ink);
        border-radius: 7px;
        padding: 0 14px;
        height: 34px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      .add-row button.add:hover {
        opacity: 0.9;
      }
      .add-row .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1 1 170px;
        min-width: 130px;
      }
      /* Autocomplete customizado (substitui o dropdown nativo de <input list>,
         que o navegador desenha sem deixar estilizar) — mesma cara de cartão
         flutuante (fundo, borda, sombra, cantos) do resto do app. position:fixed
         + coordenadas calculadas via JS (ver bindAutocomplete) porque os campos
         ficam dentro de .card, que tem overflow:hidden (pra arredondar as
         tabelas) — um dropdown position:absolute normal ficaria cortado ali. */
      .ac-list {
        position: fixed;
        z-index: 60;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 4px;
        max-height: 220px;
        overflow-y: auto;
      }
      .ac-item {
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 13px;
        line-height: 1.3;
        color: var(--ink);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ac-item:hover,
      .ac-item.active {
        background: var(--surface-2);
      }
      .add-row .field label {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-faint);
      }
      .add-row .field:has(input.money) {
        flex: 0 1 200px;
        min-width: 170px;
      }
      .add-row .field:has(input.small) {
        flex: 0 1 96px;
        min-width: 80px;
      }
      .add-row .field:has(input.month) {
        flex: 0 1 200px;
        min-width: 180px;
      }
      .add-row input.month {
        min-width: 0;
      }
      .add-row .field:has(select) {
        flex: 0 1 160px;
        min-width: 140px;
      }
      .add-row .field-check {
        flex: 0 1 140px;
        min-width: 120px;
        justify-content: flex-end;
      }
      .add-row .check-row {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 34px;
      }
      .add-row .field[hidden] {
        display: none !important;
      }
      /* check-row fora de .add-row (ex.: tela de Limpar dados) usa o mesmo visual,
     sem a altura fixa de 34px pensada pra ficar alinhada com os campos do formulário. */
      .check-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .check-row input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--primary);
        cursor: pointer;
        flex: 0 0 auto;
      }
      .check-row span {
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
      }

      /* forms grid for settings/investimentos */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        padding: 16px;
      }
      .form-grid .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .form-grid label {
        font-size: 11px;
        color: var(--ink-muted);
        font-weight: 500;
      }
      .form-grid input {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 7px;
        padding: 9px 10px;
        font-family: "IBM Plex Mono";
      }
      .progress {
        height: 8px;
        border-radius: 99px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 6px;
      }
      .progress > div {
        height: 100%;
        background: var(--primary);
      }

      .top-caption {
        font-size: 11px;
        color: var(--ink-faint);
      }

      .undo-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--surface);
        padding: 10px 16px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 13px;
        box-shadow: var(--shadow);
        z-index: 50;
      }
      .undo-toast button {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: inherit;
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .undo-toast button:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 20, 30, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 80;
      }
      .modal-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 26px 26px 22px;
        max-width: 380px;
        width: 100%;
      }
      .modal-card h3 {
        font-size: 17px;
        margin-bottom: 8px;
      }
      .modal-copy {
        color: var(--ink-muted);
        font-size: 13px;
        line-height: 1.6;
        margin: 0 0 16px;
      }

      @media (max-width: 860px) {
        #app {
          flex-direction: column;
        }
        #sidebar {
          width: 100%;

    <script>
      (function () {

        /* ============================================================
     0. Utilidades de data / dinheiro
  ============================================================ */
        const MONTH_NAMES = [
          "Janeiro",
          "Fevereiro",
          "Março",
          "Abril",
          "Maio",
          "Junho",
          "Julho",
          "Agosto",
          "Setembro",
          "Outubro",
          "Novembro",
          "Dezembro",
        ];
        const fmtBRL = new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
        function money(n) {
          return fmtBRL.format(Number(n) || 0);
        }
        // Aceita valores digitados tanto com vírgula (padrão BR: 15,50 ou 1.234,56)
        // quanto com ponto (15.50) como separador decimal.
        function parseMoney(v) {
          if (v == null || v === "") return 0;
          let s = String(v).trim();
          if (s.includes(",") && s.includes("."))
            s = s.replace(/\./g, "").replace(",", ".");
          else if (s.includes(",")) s = s.replace(",", ".");
          const n = Number(s);
          return isNaN(n) ? 0 : n;
        }
        // Rateio de despesa fixa: quando marcado, o valor digitado é o valor TOTAL
        // da despesa (ex.: conta de condomínio de R$500 dividida em 5 cotas), e o
        // que de fato entra nas saídas do mês é a fração das cotas que a pessoa
        // paga: valorAPagar = (valorTotal / cotasTotais) * cotasPagas.
        function buildRateioFields(fd) {
          const rateio = fd.get("rateio") === "1";
          if (!rateio)
            return {
              rateio: false,
              valorTotal: null,
              cotasTotais: null,
              cotasPagas: null,
              valor: parseMoney(fd.get("valor")),
            };
          const valorTotal = parseMoney(fd.get("valor"));
          const cotasTotais = Number(fd.get("cotasTotais")) || 1;
          const cotasPagas = Number(fd.get("cotasPagas")) || 0;
          const valor =
            Math.round((valorTotal / cotasTotais) * cotasPagas * 100) / 100;
          return { rateio: true, valorTotal, cotasTotais, cotasPagas, valor };
        }
        function pad2(n) {
          return String(n).padStart(2, "0");
        }
        function monthKey(y, m) {
          return y + "-" + pad2(m);
        }
        function parseKey(k) {
          const [y, m] = k.split("-").map(Number);
          return { y, m };
        }
        function monthLabel(k) {
          const { y, m } = parseKey(k);
          return MONTH_NAMES[m - 1] + " / " + y;
        }
        function addMonths(k, n) {
          let { y, m } = parseKey(k);
          m += n;
          y += Math.floor((m - 1) / 12);
          m = ((((m - 1) % 12) + 12) % 12) + 1;
          return monthKey(y, m);
        }
        function monthDiff(a, b) {
          const A = parseKey(a),
            B = parseKey(b);
          return (B.y - A.y) * 12 + (B.m - A.m);
        }
        function todayKey() {
          const d = new Date();
          return monthKey(d.getFullYear(), d.getMonth() + 1);
        }
        function uid() {
          return (
            Math.random().toString(36).slice(2, 10) +
            Date.now().toString(36).slice(-4)
          );
        }
        function esc(s) {
          return String(s == null ? "" : s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }

        /* ============================================================
     0c. Modo claro/escuro
     O CSS já define as duas paletas via [data-theme="light"/"dark"] no
     <html> (e segue a preferência do sistema quando nenhum dos dois está
     setado). A escolha feita aqui é só uma conveniência de quem está vendo
     a tela — fica salva no localStorage do navegador, nunca no banco (não é
     um dado do usuário pra sincronizar entre dispositivos).
  ============================================================ */
        function readStoredTheme() {
          try {
            return localStorage.getItem("livro-caixa-theme");
          } catch (e) {
            return null;
          }
        }
        function writeStoredTheme(v) {
          try {
            localStorage.setItem("livro-caixa-theme", v);
          } catch (e) {}
        }
        function currentEffectiveTheme() {
          const attr = document.documentElement.getAttribute("data-theme");
          if (attr === "light" || attr === "dark") return attr;
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        function updateThemeToggleIcon() {
          const btn = document.getElementById("themeToggle");
          if (!btn) return;
          const eff = currentEffectiveTheme();
          btn.textContent = eff === "dark" ? "☀" : "☾";
          btn.title =
            eff === "dark" ? "Mudar para modo claro" : "Mudar para modo escuro";
          btn.setAttribute("aria-label", btn.title);
        }
        function applyTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          writeStoredTheme(theme);
          updateThemeToggleIcon();
        }
        (function initTheme() {
          const stored = readStoredTheme();
          if (stored === "light" || stored === "dark")
            document.documentElement.setAttribute("data-theme", stored);
          updateThemeToggleIcon();
        })();

        /* ============================================================
     0b. Salário bruto → líquido (tabelas 2026 — INSS e IRPF)
     Fontes verificadas em set/2026: teto do INSS confirmado no
     site oficial gov.br/inss (reajuste 3,9% → R$ 8.475,55); tabela
     de faixas do INSS conforme salário mínimo 2026 (R$ 1.621,00);
     tabela IRPF e regra de redução da Lei 15.270/2025 (isenção até
     R$ 5.000 e redução progressiva até R$ 7.350).
  ============================================================ */
        const INSS_2026 = {
          teto: 8475.55,
          tetoContribuicao: 988.09,
          faixas: [
            { ate: 1621.0, aliq: 0.075, deduzir: 0 },
            { ate: 2902.84, aliq: 0.09, deduzir: 24.32 },
            { ate: 4354.27, aliq: 0.12, deduzir: 111.4 },
            { ate: 8475.55, aliq: 0.14, deduzir: 198.49 },
          ],
        };
        const IRPF_2026 = {
          dependente: 189.59,
          descontoSimplificado: 607.2,
          faixas: [
            { ate: 2428.8, aliq: 0, deduzir: 0 },
            { ate: 2826.65, aliq: 0.075, deduzir: 182.16 },
            { ate: 3751.05, aliq: 0.15, deduzir: 394.16 },
            { ate: 4664.68, aliq: 0.225, deduzir: 675.49 },
            { ate: Infinity, aliq: 0.275, deduzir: 908.73 },
          ],
        };
        function calcINSS(bruto) {
          const base = Math.min(Number(bruto) || 0, INSS_2026.teto);
          const faixa =
            INSS_2026.faixas.find((f) => base <= f.ate) ||
            INSS_2026.faixas[INSS_2026.faixas.length - 1];
          const valor = base * faixa.aliq - faixa.deduzir;
          return Math.max(0, Math.round(valor * 100) / 100);
        }
        function calcIRPF(bruto, inss, dependentes) {
          bruto = Number(bruto) || 0;
          dependentes = Number(dependentes) || 0;
          const deducaoItemizada = inss + dependentes * IRPF_2026.dependente;
          const deducao = Math.max(
            deducaoItemizada,
            IRPF_2026.descontoSimplificado,
          );
          const base = Math.max(0, bruto - deducao);
          const faixa = IRPF_2026.faixas.find((f) => base <= f.ate);
          const irBase = Math.max(0, base * faixa.aliq - faixa.deduzir);
          // Redução da Lei 15.270/2025 (isenção ampliada), calculada sobre o rendimento bruto mensal
          let reducao = 0;
          if (bruto <= 5000) reducao = irBase;
          else if (bruto <= 7350)
            reducao = Math.max(0, 978.62 - 0.133145 * bruto);
          const irFinal = Math.max(0, irBase - reducao);
          return Math.round(irFinal * 100) / 100;
        }
        function calcSalarioLiquido(bruto, dependentes) {
          bruto = Number(bruto) || 0;
          const inss = calcINSS(bruto);
          const irpf = calcIRPF(bruto, inss, dependentes);
          const liquido = Math.max(0, bruto - inss - irpf);
          return {
            bruto,
            inss,
            irpf,
            liquido,
            dependentes: Number(dependentes) || 0,
          };
        }

        function deepMerge(target, src) {
          for (const k in src) {
            if (
              src[k] &&
              typeof src[k] === "object" &&
              !Array.isArray(src[k]) &&
              target[k] &&
              typeof target[k] === "object" &&
              !Array.isArray(target[k])
            ) {
              deepMerge(target[k], src[k]);
            } else {
              target[k] = src[k];
            }
          }
          return target;
        }

        /* ============================================================
     1. Camada de dados — usa a capability "db" quando disponível;
        cai para um armazenamento em memória (mesma API) quando não.
  ============================================================ */
        function createMemDb() {
          const store = new Map();
          const docListeners = new Map();
          const collListeners = new Map();

          function snapOf(path) {
            const exists = store.has(path);
            const raw = exists ? store.get(path) : undefined;
            return {
              id: path.split("/").pop(),
              exists,
              data: () => (exists ? structuredClone(raw) : undefined),
              metadata: { fromCache: false, hasPendingWrites: false },
            };
          }
          function parentColl(path) {
            return path.split("/").slice(0, -1).join("/");
          }
          function childIds(collPath) {
            const prefix = collPath + "/";
            const ids = new Set();
            for (const p of store.keys()) {
              if (p.startsWith(prefix)) {
                const rest = p.slice(prefix.length);
                if (!rest.includes("/")) ids.add(rest);
              }
            }
            return [...ids];
          }
          function collSnap(collPath) {
            const docs = childIds(collPath)
              .map((id) => snapOf(collPath + "/" + id))
              .filter((d) => d.exists);
            return {
              docs,
              size: docs.length,
              empty: docs.length === 0,
              docChanges: () => [],
              metadata: { fromCache: false, hasPendingWrites: false },
            };
          }
          function notifyDoc(path) {
            (docListeners.get(path) || new Set()).forEach((fn) =>
              fn(snapOf(path)),
            );
          }
          function notifyColl(path) {
            (collListeners.get(path) || new Set()).forEach((fn) =>
              fn(collSnap(path)),
            );
          }
          function touch(path) {
            notifyDoc(path);
            notifyColl(parentColl(path));
          }

          function docRef(path) {
            return {
              id: path.split("/").pop(),
              path,
              get: async () => snapOf(path),
              set: async (data) => {
                store.set(path, structuredClone(data));
                touch(path);
              },
              update: async (data) => {
                if (!store.has(path))
                  throw {
                    code: "invalid_argument",
                    message: "documento inexistente",
                  };
                deepMerge(store.get(path), structuredClone(data));
                touch(path);
              },
              delete: async () => {
                store.delete(path);
                touch(path);
              },
              onSnapshot: (next) => {
                if (!docListeners.has(path)) docListeners.set(path, new Set());
                docListeners.get(path).add(next);
                next(snapOf(path));
                return () => docListeners.get(path).delete(next);
              },
              collection: (sub) => collRef(path + "/" + sub),
            };
          }
          function collRef(path) {
            const q = {
              path,
              where() {
                return q;
              },
              orderBy() {
                return q;
              },
              limit() {
                return q;
              },
              get: async () => collSnap(path),
              onSnapshot: (next) => {
                if (!collListeners.has(path))
                  collListeners.set(path, new Set());
                collListeners.get(path).add(next);
                next(collSnap(path));
                return () => collListeners.get(path).delete(next);
              },
              doc: (id) => docRef(path + "/" + (id || uid())),
              add: async (data) => {
                const ref = q.doc();
                await ref.set(data);
                return ref;
              },
            };
            return q;
          }
          return { doc: docRef, collection: collRef, __mem: true };
        }

        const state = {
          db: null,
          ready: false,
          month: addMonths(todayKey(), 1), // abre sempre no mês seguinte ao atual
          section: "resumo",
          navOpen: {},
          resumoOpen: {},
          pessoaGroupOpen: {},
          tabs: {},
          editing: null,
          undo: null,
          clearSelected: {},
          clearConfirm: false,
          isDemo: false,
          userEmail: "",
          deleteAccountConfirm: false,
          deleteAccountBusy: false,
          deleteAccountError: null,
          settings: {
            salarioLiquido: 0,
            aporteMensal: 0,
            reservaAtual: 0,
            reservaMeta: 0,
            investidoAtual: 0,
            displayName: "",
          },
          income: [],
          fixed: [],
          installments: [],
          cards: [],
          cardTx: [],
          provisions: [],
          shares: [],
          monthDoc: { pagamentos: {} },
        };

        // Cliente Supabase (criado em initAuth(), quando SUPABASE_CONFIGURED).
        let sb = null;

        // Adaptador que expõe o Postgres do Supabase com a MESMA forma de
        // chamadas que createMemDb() já usava (doc/collection/get/set/update/
        // delete/onSnapshot/add) — assim todo o resto do app (telas, formulários,
        // undo, etc.) não precisa saber se está falando com o Supabase de
        // verdade ou com o banco em memória do modo demonstração.
        //
        // Por baixo, cada "documento" é uma linha da tabela public.documents
        // (colunas user_id + path + data jsonb), sempre filtrada por
        // user_id = auth.uid() — exatamente o que a regra em supabase.sql
        // restringe por conta (ver LEIA-ME.md). Como o Postgres é relacional
        // (não um banco de documentos aninhados feito o Firestore), uma
        // "coleção" aqui é só o primeiro pedaço do path (ex.: 'income' em
        // 'income/abc123'), guardado numa coluna gerada (collection) pra dar
        // pra filtrar rápido.
        //
        // Cada onSnapshot reage de dois jeitos, um por cima do outro: (1) um
        // aviso local, instantâneo, sempre que ESTA aba escreve algo (funciona
        // mesmo sem Realtime configurado no projeto); (2) o Realtime do
        // Supabase (postgres_changes), que também recarrega quando outra aba
        // ou outro dispositivo logado na mesma conta muda algo. Se o Realtime
        // não estiver ligado no projeto, o app continua funcionando normal
        // nesta aba — só não vê ao vivo o que foi mudado em outro dispositivo
        // sem recarregar a página.
        function createSupabaseDb(authUid) {
          const docListeners = new Map(); // path -> Set(refreshFn)
          const collListeners = new Map(); // collection -> Set(refreshFn)

          function addDocListener(path, fn) {
            if (!docListeners.has(path)) docListeners.set(path, new Set());
            docListeners.get(path).add(fn);
            return () => docListeners.get(path).delete(fn);
          }
          function addCollListener(coll, fn) {
            if (!collListeners.has(coll)) collListeners.set(coll, new Set());
            collListeners.get(coll).add(fn);
            return () => collListeners.get(coll).delete(fn);
          }
          function notifyPath(path) {
            (docListeners.get(path) || new Set()).forEach((fn) => fn());
            const coll = path.split("/")[0];
            (collListeners.get(coll) || new Set()).forEach((fn) => fn());
          }

          async function fetchDoc(path) {
            const { data, error } = await sb
              .from("documents")
              .select("path,data")
              .eq("user_id", authUid)
              .eq("path", path)
              .maybeSingle();
            if (error) throw error;
            return data;
          }
          async function fetchColl(coll) {
            const { data, error } = await sb
              .from("documents")
              .select("path,data")
              .eq("user_id", authUid)
              .eq("collection", coll);
            if (error) throw error;
            return data || [];
          }
          function wrapSnapDoc(path, row) {
            const id = path.split("/").pop();
            if (!row)
              return {
                id,
                exists: false,
                data: () => undefined,
                metadata: { fromCache: false, hasPendingWrites: false },
              };
            return {
              id,
              exists: true,
              data: () => structuredClone(row.data || {}),
              metadata: { fromCache: false, hasPendingWrites: false },
            };
          }

          function wrapDoc(path) {
            return {
              id: path.split("/").pop(),
              path,
              get: async () => wrapSnapDoc(path, await fetchDoc(path)),
              set: async (data) => {
                const { error } = await sb
                  .from("documents")
                  .upsert(
                    {
                      user_id: authUid,
                      path,
                      data,
                      updated_at: new Date().toISOString(),
                    },
                    { onConflict: "user_id,path" },
                  );
                if (error) throw error;
                notifyPath(path);
              },
              update: async (patch) => {
                const cur = await fetchDoc(path);
                if (!cur)
                  throw {
                    code: "invalid-argument",
                    message: "documento inexistente",
                  };
                const merged = deepMerge(
                  structuredClone(cur.data || {}),
                  structuredClone(patch),
                );
                const { error } = await sb
                  .from("documents")
                  .update({
                    data: merged,
                    updated_at: new Date().toISOString(),
                  })
                  .eq("user_id", authUid)
                  .eq("path", path);
                if (error) throw error;
                notifyPath(path);
              },
              delete: async () => {
                const { error } = await sb
                  .from("documents")
                  .delete()
                  .eq("user_id", authUid)
                  .eq("path", path);
                if (error) throw error;
                notifyPath(path);
              },
              onSnapshot: (next, err) => {
                let stopped = false;
                async function refresh() {
                  try {
                    const row = await fetchDoc(path);
                    if (!stopped) next(wrapSnapDoc(path, row));
                  } catch (e) {
                    if (err) err(e);
                  }
                }
                refresh();
                const removeLocal = addDocListener(path, refresh);
                const channel = sb
                  .channel("doc:" + authUid + ":" + path)
                  .on(
                    "postgres_changes",
                    {
                      event: "*",
                      schema: "public",
                      table: "documents",
                      filter: `user_id=eq.${authUid}`,
                    },
                    (payload) => {
                      const p =
                        (payload.new && payload.new.path) ||
                        (payload.old && payload.old.path);
                      if (p === path) refresh();
                    },
                  )
                  .subscribe();
                return () => {
                  stopped = true;
                  removeLocal();
                  sb.removeChannel(channel);
                };
              },
            };
          }
          function wrapColl(coll) {
            return {
              path: coll,
              doc: (id) => wrapDoc(coll + "/" + (id || uid())),
              add: async (data) => {
                const id = uid();
                const path = coll + "/" + id;
                const { error } = await sb
                  .from("documents")
                  .insert({
                    user_id: authUid,
                    path,
                    data,
                    updated_at: new Date().toISOString(),
                  });
                if (error) throw error;
                notifyPath(path);
                return wrapDoc(path);
              },
              get: async () => {
                const rows = await fetchColl(coll);
                const docs = rows.map((r) => wrapSnapDoc(r.path, r));
                return { docs, size: docs.length, empty: docs.length === 0 };
              },
              onSnapshot: (next, err) => {
                let stopped = false;
                async function refresh() {
                  try {
                    const rows = await fetchColl(coll);
                    if (stopped) return;
                    const docs = rows.map((r) => wrapSnapDoc(r.path, r));
                    next({ docs, size: docs.length, empty: docs.length === 0 });
                  } catch (e) {
                    if (err) err(e);
                  }
                }
                refresh();
                const removeLocal = addCollListener(coll, refresh);
                const channel = sb
                  .channel("coll:" + authUid + ":" + coll)
                  .on(
                    "postgres_changes",
                    {
                      event: "*",
                      schema: "public",
                      table: "documents",
                      filter: `user_id=eq.${authUid}`,
                    },
                    (payload) => {
                      const p =
                        (payload.new && payload.new.path) ||
                        (payload.old && payload.old.path);
                      if (p && p.split("/")[0] === coll) refresh();
                    },
                  )
                  .subscribe();
                return () => {
                  stopped = true;
                  removeLocal();
                  sb.removeChannel(channel);
                };
              },
            };
          }
          return {
            doc: (path) => wrapDoc(path),
            collection: (path) => wrapColl(path),
          };
        }

        // Nome de exibição: mostrado na barra lateral no lugar do e-mail, e
        // usado como "pessoa" nos lançamentos espelhados por Compartilhamento
        // (ver syncShareMirror) — assim quem recebe vê um nome, não seu e-mail.
        // Cai pro e-mail enquanto o nome não foi definido (ou em modo demo).
        function renderUserName() {
          const el = document.getElementById("userName");
          if (!el) return;
          el.textContent =
            (state.settings && state.settings.displayName) ||
            state.userEmail ||
            "";
        }
        // Enquanto o nome de exibição não for preenchido, pergunta de novo
        // toda vez que entrar no sistema — "Agora não" só fecha o popup desta
        // vez (não grava nada), então ele volta a aparecer no próximo login.
        // Só some de vez quando um nome é salvo.
        function maybeShowNamePrompt() {
          if (state.isDemo || state.settings.displayName) return;
          const modal = document.getElementById("nameModal");
          if (!modal) return;
          const input = document.getElementById("nameInput");
          if (input) input.value = state.settings.displayName || "";
          modal.hidden = false;
        }

        // Liga as coleções/listeners do app depois que já sabemos com qual banco
        // falar (Postgres de uma conta Supabase real, ou o banco local do modo
        // demonstração) — substitui o antigo initDb() que resolvia isso sozinho
        // via window.claude.use('db') (recurso específico do Claude Artifact).
        function bootApp(db, isDemo) {
          state.db = db;
          state.isDemo = isDemo;

          const statusDot = document.getElementById("storeStatus");
          const statusText = document.getElementById("storeStatusText");
          if (isDemo) {
            statusDot.classList.add("offline");
            statusText.textContent =
              "modo demonstração (dados só neste navegador)";
          } else {
            statusText.textContent = "salvo automaticamente na sua conta";
          }

          let namePromptChecked = false;
          db.doc("settings/general").onSnapshot((snap) => {
            if (snap.exists) Object.assign(state.settings, snap.data());
            state.ready = true;
            renderUserName();
            if (!namePromptChecked) {
              namePromptChecked = true;
              maybeShowNamePrompt();
            }
            renderAll();
          });

          subscribeList("income", "income");
          subscribeList("fixedExpenses", "fixed");
          subscribeList("installments", "installments");
          subscribeList("cards", "cards");
          subscribeList("cardTransactions", "cardTx");
          subscribeList("provisions", "provisions");
          subscribeList("shares", "shares");

          watchMonth(state.month);
        }

        function showApp() {
          document.getElementById("loginScreen").hidden = true;
          document.getElementById("app").hidden = false;
        }
        function showLogin() {
          document.getElementById("app").hidden = true;
          document.getElementById("loginScreen").hidden = false;
          document.getElementById("loginCard").hidden = false;
          document.getElementById("recoveryCard").hidden = true;
        }
        function showRecovery() {
          document.getElementById("app").hidden = true;
          document.getElementById("loginScreen").hidden = false;
          document.getElementById("loginCard").hidden = true;
          document.getElementById("recoveryCard").hidden = false;
        }

        // Login por e-mail/senha (Supabase Auth) — cada conta só enxerga o que
        // está em public.documents com user_id = auth.uid() (ver supabase.sql).
        // Enquanto SUPABASE_URL/SUPABASE_ANON_KEY não forem preenchidos (veja o
        // LEIA-ME.md), libera só o modo demonstração pra já dar pra ver o app
        // funcionando.
        function initAuth() {
          const demoBtn = document.getElementById("demoModeBtn");
          const noteEl = document.getElementById("loginNote");
          const infoEl = document.getElementById("loginInfo");
          const errEl = document.getElementById("loginError");
          const signOutBtn = document.getElementById("signOutBtn");
          const form = document.getElementById("loginForm");
          const emailInput = document.getElementById("loginEmail");
          const passwordInput = document.getElementById("loginPassword");
          const signInBtn = document.getElementById("signInBtn");
          const authLinkBtn = document.getElementById("authLinkBtn");
          const recoveryForm = document.getElementById("recoveryForm");
          const recoveryPasswordInput =
            document.getElementById("recoveryPassword");
          const recoveryPasswordConfirmInput = document.getElementById(
            "recoveryPasswordConfirm",
          );
          const recoverySaveBtn = document.getElementById("recoverySaveBtn");
          const recoveryErrEl = document.getElementById("recoveryError");
          const rememberEmailCheck = document.getElementById("rememberEmail");
          const REMEMBER_EMAIL_KEY = "livro-caixa-remember-email";
          // Lembrar e-mail: só o e-mail fica salvo (localStorage, só neste
          // navegador) — a senha em si nunca é guardada aqui (senha em texto
          // puro no localStorage é um risco real: qualquer bug de XSS futuro,
          // ou só alguém com acesso físico ao navegador, teria acesso direto a
          // ela). Pra quem quiser não digitar a senha toda vez, o próprio
          // gerenciador de senhas do navegador já cobre isso (os campos abaixo
          // já têm autocomplete="email"/"current-password" pra ativar aquele
          // prompt nativo de "salvar senha?").
          try {
            const savedEmail = localStorage.getItem(REMEMBER_EMAIL_KEY);
            if (savedEmail) {
              emailInput.value = savedEmail;
              if (rememberEmailCheck) rememberEmailCheck.checked = true;
            }
          } catch (e) {}

          function showError(msg) {
            errEl.hidden = false;
            errEl.textContent = msg;
            infoEl.hidden = true;
          }
          function showInfo(msg) {
            infoEl.hidden = false;
            infoEl.textContent = msg;
            errEl.hidden = true;
          }
          function clearMsgs() {
            errEl.hidden = true;
            infoEl.hidden = true;
          }
          function setBusy(busy) {
            signInBtn.disabled = busy;
            authLinkBtn.disabled = busy;
          }

          if (!SUPABASE_CONFIGURED) {
            demoBtn.hidden = false;
            noteEl.hidden = false;
            noteEl.textContent =
              "O Supabase ainda não foi configurado neste arquivo (veja o LEIA-ME.md) — por enquanto só o modo demonstração funciona.";
            setBusy(true);
            emailInput.disabled = true;
            passwordInput.disabled = true;
            signOutBtn.addEventListener("click", () => location.reload());
            demoBtn.addEventListener("click", () => {
              document.getElementById("userName").textContent =
                "Modo demonstração";
              showApp();
              bootApp(createMemDb(), true);
            });
            return;
          }

          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          let booted = false;

          // O link de redefinição de senha chega com "type=recovery" na URL — na
          // hash (#access_token=...&type=recovery), no fluxo antigo, ou na query
          // (?code=...&type=recovery), no fluxo PKCE que os projetos novos usam.
          // Só o evento PASSWORD_RECOVERY do onAuthStateChange NÃO é confiável:
          // no fluxo PKCE o Supabase dispara SIGNED_IN mesmo sendo uma
          // recuperação de senha, o que jogaria direto pra dentro do app sem
          // trocar a senha. Por isso checamos a URL diretamente (é o que a própria
          // documentação do Supabase recomenda) e, enquanto isRecovery for true,
          // ignoramos qualquer SIGNED_IN e ficamos travados na tela de nova senha.
          let isRecovery =
            new URLSearchParams(location.hash.replace(/^#/, "")).get("type") ===
              "recovery" ||
            new URLSearchParams(location.search).get("type") === "recovery";
          if (isRecovery) showRecovery();

          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearMsgs();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) return;
            setBusy(true);
            const { error } = await sb.auth.signInWithPassword({
              email,
              password,
            });
            setBusy(false);
            if (error) {
              showError(
                "Não foi possível entrar: " +
                  (error.message || "confira e-mail e senha."),
              );
              return;
            }
            try {
              if (rememberEmailCheck && rememberEmailCheck.checked) {
                localStorage.setItem(REMEMBER_EMAIL_KEY, email);
              } else {
                localStorage.removeItem(REMEMBER_EMAIL_KEY);
              }
            } catch (e) {}
          });

          // Link dinâmico abaixo do form: em vez de sempre mostrar "Criar conta",
          // pergunta pro banco (função email_registered em supabase.sql) se o
          // e-mail digitado já tem cadastro, e mostra "Criar uma nova conta" (se
          // não tem) ou "Esqueceu a senha?" (se já tem). checkToken descarta
          // respostas que chegam atrasadas (ex.: usuário já apagou o e-mail).
          let checkToken = 0;
          function setAuthLinkMode(mode) {
            authLinkBtn.dataset.mode = mode || "";
            authLinkBtn.hidden = !mode;
            if (mode === "signup")
              authLinkBtn.textContent = "Não tem conta? Criar uma nova conta";
            if (mode === "reset") authLinkBtn.textContent = "Esqueceu a senha?";
          }
          const checkEmail = debounce(async () => {
            const email = emailInput.value.trim();
            const token = ++checkToken;
            if (!email || !emailInput.checkValidity()) {
              setAuthLinkMode(null);
              return;
            }
            const { data, error } = await sb.rpc("email_registered", {
              check_email: email,
            });
            if (token !== checkToken) return;
            if (error) {
              setAuthLinkMode(null);
              return;
            }
            setAuthLinkMode(data ? "reset" : "signup");
          }, 400);
          emailInput.addEventListener("input", () => {
            clearMsgs();
            checkEmail();
          });

          authLinkBtn.addEventListener("click", async () => {
            clearMsgs();
            const mode = authLinkBtn.dataset.mode;
            const email = emailInput.value.trim();
            if (!email) return;
            if (mode === "signup") {
              const password = passwordInput.value;
              if (!password) {
                showError(
                  "Digite a senha que você quer usar antes de criar a conta.",
                );
                return;
              }
              if (password.length < 6) {
                showError("A senha precisa ter pelo menos 6 caracteres.");
                return;
              }
              setBusy(true);
              const { data, error } = await sb.auth.signUp({ email, password });
              setBusy(false);
              if (error) {
                showError(
                  "Não foi possível criar a conta: " +
                    (error.message || "tente novamente."),
                );
                return;
              }
              if (!(data && data.session)) {
                showInfo(
                  "Conta criada! Se o projeto exigir confirmação, confira o e-mail (" +
                    email +
                    ") antes de entrar.",
                );
              }
            } else if (mode === "reset") {
              setBusy(true);
              const { error } = await sb.auth.resetPasswordForEmail(email, {
                redirectTo: location.origin + location.pathname,
              });
              setBusy(false);
              if (error) {
                showError(
                  "Não foi possível enviar o e-mail de redefinição: " +
                    (error.message || "tente novamente."),
                );
                return;
              }
              showInfo(
                "Enviamos um e-mail para " +
                  email +
                  " com um link para você definir uma nova senha.",
              );
            }
          });

          // Redefinição de senha: o link do e-mail volta pra esta mesma página com
          // um token de recuperação na URL (ver o isRecovery acima, que decide
          // exibir esta tela). Salvar aqui só troca a senha da sessão já aberta
          // pelo link.
          recoveryForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            recoveryErrEl.hidden = true;
            const password = recoveryPasswordInput.value;
            const passwordConfirm = recoveryPasswordConfirmInput.value;
            if (password.length < 6) {
              recoveryErrEl.hidden = false;
              recoveryErrEl.textContent =
                "A senha precisa ter pelo menos 6 caracteres.";
              return;
            }
            if (password !== passwordConfirm) {
              recoveryErrEl.hidden = false;
              recoveryErrEl.textContent = "As senhas digitadas não são iguais.";
              return;
            }
            recoverySaveBtn.disabled = true;
            const { error } = await sb.auth.updateUser({ password });
            recoverySaveBtn.disabled = false;
            if (error) {
              recoveryErrEl.hidden = false;
              recoveryErrEl.textContent =
                "Não foi possível salvar: " +
                (error.message || "tente novamente.");
              return;
            }
            // Senha trocada: sai do "modo recuperação" e limpa o code/type=recovery
            // da URL antes de recarregar, senão o próximo load ia achar que ainda
            // está num link de redefinição e travar de novo na tela de nova senha.
            isRecovery = false;
            location.replace(location.pathname);
          });

          signOutBtn.addEventListener("click", () => sb.auth.signOut());

          sb.auth.onAuthStateChange((event, session) => {
            if (event === "PASSWORD_RECOVERY") isRecovery = true;
            if (isRecovery) {
              showRecovery();
              return;
            }
            const user = session && session.user;
            if (user) {
              state.userEmail = user.email || "";
              renderUserName();
              showApp();
              if (!booted) {
                booted = true;
                bootApp(createSupabaseDb(user.id), false);
              }
            } else if (booted) {
              // Saiu (ou trocou de conta) depois que o app já tinha carregado —
              // recarrega do zero pra não deixar listeners da conta anterior
              // ativos nem misturar dados de contas diferentes na mesma página.
              location.reload();
            } else {
              showLogin();
            }
          });
        }

        function subscribeList(collPath, stateKey) {
          state.db.collection(collPath).onSnapshot((snap) => {
            state[stateKey] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderAll();
          });
        }

        // Desfazer: guarda só a última ação destrutiva (exclusões de lançamentos e
        // de cartões). Some sozinho depois de um tempo, ou quando outra ação de
        // exclusão acontece antes.
        let undoTimer = null;
        function setUndo(label, run) {
          state.undo = { label, run };
          clearTimeout(undoTimer);
          undoTimer = setTimeout(() => {
            state.undo = null;
            renderUndoToast();
          }, 8000);
          renderUndoToast();
        }
        // Exclusão "de todos os meses" de uma despesa fixa/receita recorrente:
        // apaga não só o trecho clicado, mas todos os outros trechos (documentos)
        // da mesma série (mesmo seriesId) que sobraram de edições anteriores
        // ("só este mês"/"este mês em diante") — senão eles ficariam sozinhos,
        // aparecendo em outros meses como se a exclusão não tivesse acontecido.
        // Itens antigos sem seriesId (criados antes desse campo existir) caem
        // pro comportamento anterior: apaga só o documento clicado.
        // Compartilhamento: um "Terceiro" (nome usado em Despesas fixas > Terceiros
        // e Receitas > Terceiros) pode estar vinculado ao e-mail de outra conta
        // cadastrada aqui (tela Settings > Compartilhamento). Quando está, todo
        // lançamento feito com esse Terceiro é espelhado automaticamente do lado
        // de lá — uma despesa de Terceiro sua vira uma receita "Terceiros" pra
        // ela, e uma receita de Terceiro sua vira uma despesa fixa de Terceiro
        // pra ela — sempre seguindo as mesmas regras de recorte por mês do resto
        // do app (ver saveFixedEditScoped/deleteFixedSeries logo abaixo).
        function findShareEmail(terceiro) {
          const norm = (s) => String(s || "").trim().toLowerCase();
          const t = norm(terceiro);
          if (!t) return null;
          const share = state.shares.find((s) => norm(s.terceiro) === t);
          return share ? String(share.email || "").trim() : null;
        }
        // Cria/atualiza (ou remove, se o compartilhamento não existir mais) o
        // espelho de UM documento de Terceiro na conta vinculada. Chamado toda
        // vez que um lançamento de Terceiro é criado, editado ou excluído.
        // sourceColl é 'fixedExpenses' (despesa -> vira receita "Outros" pra ela)
        // ou 'income' (receita -> vira despesa de Terceiro pra ela).
        async function syncShareMirror(sourceColl, sourceId, doc) {
          if (!sb || state.isDemo) return; // só faz sentido com conta real (Supabase)
          if (
            sourceColl !== "fixedExpenses" &&
            sourceColl !== "income" &&
            sourceColl !== "installments"
          )
            return;
          if (!doc || !doc.pessoa) return;
          const isParceladoIncome = sourceColl === "income" && !!doc.totalParcelas;
          // Pra onde espelha, conforme a origem:
          //  - Despesas fixas > Terceiro (recorrente)  -> Receitas > Terceiros (recorrente)
          //  - Parcelamento                             -> Receitas > Terceiros (parcelado)
          //  - Receitas > Terceiros (recorrente)         -> Despesas fixas > Terceiro
          //  - Receitas > Terceiros (parcelado)          -> Parcelamento
          const targetColl =
            sourceColl === "fixedExpenses" || sourceColl === "installments"
              ? "income"
              : isParceladoIncome
                ? "installments"
                : "fixedExpenses";
          const email = findShareEmail(doc.pessoa);
          // Nome que aparece pra quem recebe o espelho: o nome de exibição
          // (Settings > o popup na 1ª vez, ou trocável depois em Minha conta),
          // caindo pro e-mail enquanto ele não for definido.
          const senderName = state.settings.displayName || state.userEmail || "";
          const existingMirror = doc.mirror || null;
          if (!email) {
            if (existingMirror) {
              await sb.rpc("mirror_write", {
                p_email: existingMirror.email,
                p_op: "delete",
                p_path: existingMirror.path,
                p_collection: null,
                p_data: null,
              });
              await state.db.doc(sourceColl + "/" + sourceId).update({ mirror: null });
            }
            return;
          }
          let mirrorData;
          if (sourceColl === "fixedExpenses") {
            mirrorData = {
              nome: doc.nome,
              valor: Number(doc.valor) || 0,
              mesInicio: doc.mesInicio,
              mesFim: doc.mesFim || null,
              pessoa: senderName,
              totalParcelas: null,
              recorrente: true,
              seriesId: doc.seriesId,
            };
          } else if (sourceColl === "installments" || isParceladoIncome) {
            // Parcelamento <-> Receita "Outros" parcelada: mesma qtd. de
            // parcelas e valor por parcela, sem recorte por mês (esse tipo não
            // tem "só este mês"/"este mês em diante").
            const valor =
              sourceColl === "installments"
                ? Number(doc.valorParcela) || 0
                : Number(doc.valor) || 0;
            mirrorData =
              targetColl === "installments"
                ? {
                    nome: doc.nome,
                    pessoa: senderName,
                    valorParcela: valor,
                    totalParcelas: Number(doc.totalParcelas) || 1,
                    mesInicio: doc.mesInicio,
                  }
                : {
                    nome: doc.nome,
                    valor,
                    mesInicio: doc.mesInicio,
                    mesFim: null,
                    pessoa: senderName,
                    totalParcelas: Number(doc.totalParcelas) || 1,
                    recorrente: false,
                  };
          } else {
            mirrorData = {
              nome: doc.nome,
              valor: Number(doc.valor) || 0,
              mesInicio: doc.mesInicio,
              mesFim: doc.mesFim || null,
              pessoa: senderName,
              seriesId: doc.seriesId,
            };
          }
          const samePath =
            existingMirror && existingMirror.email === email
              ? existingMirror.path
              : null;
          const { data: path, error } = await sb.rpc("mirror_write", {
            p_email: email,
            p_op: "upsert",
            p_path: samePath,
            p_collection: targetColl,
            p_data: mirrorData,
          });
          if (error) {
            console.error("Falha ao espelhar lançamento compartilhado:", error);
            return;
          }
          if (!existingMirror || existingMirror.email !== email || existingMirror.path !== path) {
            await state.db
              .doc(sourceColl + "/" + sourceId)
              .update({ mirror: { email, path } });
          }
        }
        // Remove o espelho de um documento de Terceiro (usado antes de apagar o
        // próprio documento, pra não deixar a cópia órfã na outra conta).
        async function deleteShareMirror(sourceColl, item) {
          if (!sb || state.isDemo) return;
          if (
            sourceColl !== "fixedExpenses" &&
            sourceColl !== "income" &&
            sourceColl !== "installments"
          )
            return;
          if (!item || !item.mirror) return;
          await sb.rpc("mirror_write", {
            p_email: item.mirror.email,
            p_op: "delete",
            p_path: item.mirror.path,
            p_collection: null,
            p_data: null,
          });
        }

        async function deleteFixedSeries(collPath, listKey, item) {
          const siblings = item.seriesId
            ? state[listKey].filter(
                (f) => f.id !== item.id && f.seriesId === item.seriesId,
              )
            : [];
          const toDelete = [item, ...siblings];
          for (const it of toDelete) {
            await deleteShareMirror(collPath, it);
          }
          const snaps = toDelete.map((it) => {
            const s = Object.assign({}, it);
            delete s.id;
            return { id: it.id, data: s };
          });
          for (const it of toDelete) {
            await state.db.doc(collPath + "/" + it.id).delete();
          }
          setUndo(
            snaps.length > 1
              ? `Removido (${snaps.length} lançamentos).`
              : "Removido.",
            async () => {
              for (const s of snaps) {
                await state.db.doc(collPath + "/" + s.id).set(s.data);
              }
              for (const s of snaps) {
                await syncShareMirror(collPath, s.id, s.data);
              }
            },
          );
        }

        // Provisão: exclusão "só este mês" (usada quando a exclusão parte da
        // tabela dentro de "Despesas próprias") — diferente de deleteFixedSeries,
        // NÃO mexe no cadastro da Provisão pros demais meses: os meses antes e
        // depois do mês em exibição continuam exatamente como foi cadastrado no
        // submenu "Provisão" (mesmo valor, mesmo "Desde"); só o mês atual passa
        // a não ter mais essa provisão. Faz isso do mesmo jeito que uma edição
        // "só este mês" (recorta em até 2 pedaços), só que sem criar um trecho
        // novo pro mês em exibição — só um buraco ali.
        async function deleteProvisaoMonthOnly(id) {
          const item = state.provisions.find((f) => f.id === id);
          if (!item) return;
          const monthKey = state.month;
          const oi = item.mesInicio,
            of = item.mesFim || null;
          const needsBefore = oi < monthKey;
          const needsAfter = of === null || of > monthKey;
          const seriesId = item.seriesId || uid();

          let afterId = null;
          if (needsAfter) {
            const oldValueFields = Object.assign({}, item);
            delete oldValueFields.id;
            delete oldValueFields.mesInicio;
            delete oldValueFields.mesFim;
            const ref = await state.db.collection("provisions").add(
              Object.assign({}, oldValueFields, {
                seriesId,
                mesInicio: addMonths(monthKey, 1),
                mesFim: of,
              }),
            );
            afterId = ref.id;
          }
          if (needsBefore) {
            await state.db
              .doc("provisions/" + id)
              .update({ mesFim: addMonths(monthKey, -1), seriesId });
          } else {
            await state.db.doc("provisions/" + id).delete();
          }

          setUndo(
            "Removido só em " + monthLabel(monthKey) + ".",
            async () => {
              if (afterId) await state.db.doc("provisions/" + afterId).delete();
              if (needsBefore) {
                await state.db
                  .doc("provisions/" + id)
                  .update({ mesFim: of });
              } else {
                const restore = Object.assign({}, item);
                delete restore.id;
                await state.db.doc("provisions/" + id).set(restore);
              }
            },
          );
        }
        function renderUndoToast() {
          const el = document.getElementById("undoToast");
          if (!el) return;
          if (!state.undo) {
            el.hidden = true;
            return;
          }
          el.hidden = false;
          const label = document.getElementById("undoToastLabel");
          if (label) label.textContent = state.undo.label;
        }

        let unwatchMonth = null;
        function watchMonth(key) {
          if (unwatchMonth) unwatchMonth();
          unwatchMonth = state.db.doc("months/" + key).onSnapshot((snap) => {
            state.monthDoc = snap.exists ? snap.data() : { pagamentos: {} };
            if (!state.monthDoc.pagamentos) state.monthDoc.pagamentos = {};
            renderAll();
          });
        }

        async function patchPagamentos(patch) {
          const key = "months/" + state.month;
          const ref = state.db.doc(key);
          const snap = await ref.get();
          if (!snap.exists) {
            await ref.set({ pagamentos: patch });
          } else {
            await ref.update({ pagamentos: patch });
          }
        }
        async function togglePago(itemId) {
          const cur = !!(
            state.monthDoc.pagamentos && state.monthDoc.pagamentos[itemId]
          );
          await patchPagamentos({ [itemId]: !cur });
        }
        async function toggleGroupPago(ids) {
          const allOn = ids.every(
            (id) =>
              !!(state.monthDoc.pagamentos && state.monthDoc.pagamentos[id]),
          );
          const patch = {};
          ids.forEach((id) => {
            patch[id] = !allOn;
          });
          await patchPagamentos(patch);
        }

        async function saveSettings(patch) {
          const ref = state.db.doc("settings/general");
          const snap = await ref.get();
          if (!snap.exists)
            await ref.set(Object.assign({}, state.settings, patch));
          else await ref.update(patch);
        }

        // Edita uma despesa fixa (própria ou de terceiro) valendo só para o mês em
        // exibição: os meses anteriores continuam com os valores antigos, e os meses
        // seguintes também — a alteração não se propaga para frente nem para trás,
        // só para o mês corrente. Faz isso "recortando" o lançamento recorrente em
        // até 3 pedaços quando necessário: o trecho antes do mês (valores antigos),
        // o próprio mês (valores novos) e o trecho depois do mês (valores antigos).
        // mode 'only' (padrão): a alteração vale só para o mês em exibição — meses
        // antes e depois continuam com os valores antigos (recorta em até 3 pedaços).
        // mode 'forward': a alteração vale a partir do mês em exibição em diante —
        // só recorta o trecho anterior (se houver histórico antes do mês), sem
        // recortar de novo depois.
        async function saveFixedEditScoped(collList, id, newFields, mode) {
          const listByColl = {
            income: state.income,
            fixedExpenses: state.fixed,
            provisions: state.provisions,
          };
          const itemsList = listByColl[collList] || state.fixed;
          const item = itemsList.find((f) => f.id === id);
          if (!item) return;
          const monthKey = state.month;
          const oi = item.mesInicio,
            of = item.mesFim || null;
          // seriesId identifica todos os trechos (documentos) que vieram do mesmo
          // lançamento recorrente original, mesmo depois de recortado em pedaços
          // por edições "só este mês"/"este mês em diante" — usado na hora de
          // excluir "de todos os meses" para apagar a série inteira, não só o
          // trecho clicado. Itens antigos sem essa chave ganham uma na primeira
          // edição (fica preservada dali em diante em todos os trechos).
          const seriesId = item.seriesId || uid();
          // Nome/pessoa/seriesId são atributos da "série" (o rótulo do lançamento)
          // e valem para todos os trechos; os demais campos de valor (valor,
          // valorBruto, INSS/IRPF calculados, dependentes, etc.) acompanham o
          // trecho editado.
          const seriesFields = { nome: newFields.nome, seriesId };
          if ("pessoa" in newFields) seriesFields.pessoa = newFields.pessoa;
          // Campos antigos a preservar no trecho "depois" quando ele precisa ser
          // recriado como um novo documento (o valor antigo, não o editado).
          const oldValueFields = Object.assign({}, item);
          delete oldValueFields.id;
          delete oldValueFields.mesInicio;
          delete oldValueFields.mesFim;
          // O trecho "depois" é um documento NOVO — não pode nascer apontando
          // pro mesmo espelho do trecho original, senão os dois ficam brigando
          // por atualizar o mesmo documento na outra conta. syncShareMirror cria
          // o espelho dele próprio, do zero, junto com o resto da função.
          delete oldValueFields.mirror;
          const needsBefore = oi < monthKey;
          if (mode === "forward") {
            // Se este item já é, ele mesmo, um segmento de um mês só (por causa de
            // uma edição "só este mês" anterior) e existe logo em seguida outro
            // segmento da mesma série (mesmo nome/pessoa, começando no mês
            // seguinte), esse segmento seguinte precisa ser absorvido — senão o
            // valor antigo dele continuaria valendo em paralelo a partir daqui.
            const nextKey = addMonths(monthKey, 1);
            const sibling = itemsList.find(
              (f) =>
                f.id !== id &&
                f.nome === item.nome &&
                (f.pessoa || null) === (item.pessoa || null) &&
                f.mesInicio === nextKey,
            );
            const effectiveOf = sibling ? sibling.mesFim || null : of;
            if (needsBefore) {
              const beforeDoc = Object.assign({}, item, seriesFields, {
                mesFim: addMonths(monthKey, -1),
              });
              await state.db.doc(collList + "/" + id).update(beforeDoc);
              await syncShareMirror(collList, id, beforeDoc);
              const afterDoc = Object.assign({}, newFields, {
                mesInicio: monthKey,
                mesFim: effectiveOf,
                seriesId,
              });
              const ref = await state.db.collection(collList).add(afterDoc);
              await syncShareMirror(collList, ref.id, afterDoc);
            } else {
              // oi === monthKey: já é o próprio início do segmento — "este mês em
              // diante" é o próprio registro (com o fim estendido, se absorveu
              // um segmento seguinte), então só atualiza direto.
              const doc = Object.assign({}, item, newFields, {
