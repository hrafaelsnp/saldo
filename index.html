        }

        const VIEWS = {
          resumo: viewResumo,
          receitas: viewReceitas,
          despesas: viewDespesas,
          provisao: viewProvisao,
          parcelas: viewParcelas,
          cartoes: viewCartoes,
          compartilhamento: viewCompartilhamento,
          limpar: viewLimparDados,
          conta: viewConta,
        };

        function renderViews() {
          const wrap = document.getElementById("views");
          wrap.innerHTML = `<section class="view active">${VIEWS[state.section]()}</section>`;
          bindViewEvents(wrap);
          bindAutocomplete(wrap);
        }

        /* ============================================================
     5. Eventos
  ============================================================ */
        function bindViewEvents(root) {
          root.querySelectorAll("[data-pay]").forEach((btn) => {
            btn.addEventListener("click", () => togglePago(btn.dataset.pay));
          });
          root.querySelectorAll("[data-paygroup]").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const ids = btn.dataset.paygroup.split(",").filter(Boolean);
              toggleGroupPago(ids);
            });
          });
          root.querySelectorAll("[data-situacao]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const id = btn.dataset.situacao;
              const tx = state.cardTx.find((x) => x.id === id);
              if (!tx) return;
              const novo =
                tx.situacao === "verificado" ? "aguardando" : "verificado";
              await state.db
                .doc("cardTransactions/" + id)
                .update({ situacao: novo });
            });
          });
          root.querySelectorAll("[data-rascunho]").forEach((cb) => {
            cb.addEventListener("change", () => {
              setRascunhoOut(cb.dataset.rascunho, cb.checked);
              renderAll();
            });
          });
          root.querySelectorAll("[data-rascunhovalue]").forEach((inp) => {
            inp.addEventListener("click", (e) => e.stopPropagation());
            inp.addEventListener("change", () => {
              state.rascunhoValores[inp.dataset.rascunhovalue] = inp.value;
              renderAll();
            });
          });
          root.querySelectorAll("[data-rascunhogroup]").forEach((cb) => {
            cb.addEventListener("change", () => {
              const ids = cb.dataset.rascunhogroup.split(",").filter(Boolean);
              ids.forEach((id) => setRascunhoOut(id, cb.checked));
              renderAll();
            });
          });
          root.querySelectorAll("[data-resumogroup]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const key = btn.dataset.resumogroup;
              state.resumoOpen[key] = !state.resumoOpen[key];
              renderViews();
            });
          });
          root.querySelectorAll("[data-pessoagroup]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const key = btn.dataset.pessoagroup;
              state.pessoaGroupOpen[key] = !isPessoaGroupOpen(key);
              renderViews();
            });
          });
          root.querySelectorAll("[data-tabkey]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const group = btn.closest("[data-tabgroup]").dataset.tabgroup;
              state.tabs[group] = btn.dataset.tabkey;
              renderViews();
            });
          });
          const map = {
            income: "income",
            fixed: "fixedExpenses",
            installments: "installments",
            cardTx: "cardTransactions",
            compartilhamento: "shares",
          };
          const listFor = {
            installments: "installments",
            cardTx: "cardTx",
            compartilhamento: "shares",
          };
          root.querySelectorAll("[data-del]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const [coll, id] = btn.dataset.del.split(":");
              if (coll === "fixed") {
                // Despesa fixa: remover não apaga o histórico. Se o lançamento já
                // valia em meses anteriores ao mês em exibição, só encerramos a
                // recorrência a partir deste mês (mesFim = mês anterior) — os
                // meses passados continuam com o lançamento normalmente. Só há
                // apagar de verdade quando não existe histórico anterior a preservar.
                const item = state.fixed.find((f) => f.id === id);
                if (item && item.mesInicio && item.mesInicio < state.month) {
                  const oldMesFim = item.mesFim || null;
                  const newMesFim = addMonths(state.month, -1);
                  await state.db
                    .doc("fixedExpenses/" + id)
                    .update({ mesFim: newMesFim });
                  await syncShareMirror("fixedExpenses", id, {
                    ...item,
                    mesFim: newMesFim,
                  });
                  setUndo(
                    "Removido a partir de " + monthLabel(state.month) + ".",
                    async () => {
                      await state.db
                        .doc("fixedExpenses/" + id)
                        .update({ mesFim: oldMesFim });
                      await syncShareMirror("fixedExpenses", id, item);
                    },
                  );
                } else if (item) {
                  await deleteFixedSeries("fixedExpenses", "fixed", item);
                }
                return;
              }
              if (coll === "provisao") {
                // Mesma regra da despesa fixa: só encerra a partir deste mês se
                // houver histórico anterior a preservar; senão apaga a série toda.
                const item = state.provisions.find((f) => f.id === id);
                if (item && item.mesInicio && item.mesInicio < state.month) {
                  const oldMesFim = item.mesFim || null;
                  await state.db
                    .doc("provisions/" + id)
                    .update({ mesFim: addMonths(state.month, -1) });
                  setUndo(
                    "Removido a partir de " + monthLabel(state.month) + ".",
                    async () => {
                      await state.db
                        .doc("provisions/" + id)
                        .update({ mesFim: oldMesFim });
                    },
                  );
                } else if (item) {
                  await deleteFixedSeries("provisions", "provisions", item);
                }
                return;
              }
              if (coll === "provisaoMes") {
                // Excluir só o mês em exibição (botão de excluir dentro de
                // "Despesas próprias") — os demais meses continuam como estão
                // cadastrados no submenu "Provisão".
                await deleteProvisaoMonthOnly(id);
                return;
              }
              if (coll === "income") {
                // Mesma regra de recorte por mês da despesa fixa, adaptada às duas
                // formas de receita: recorrente (mesInicio/mesFim) e parcelamento
                // (Outros com qtd. de parcelas) — nesse caso "excluir a partir daqui"
                // vira reduzir o total de parcelas até a anterior a este mês.
                const item = state.income.find((f) => f.id === id);
                if (item && item.totalParcelas) {
                  const atual = monthDiff(item.mesInicio, state.month) + 1;
                  if (atual > 1) {
                    const oldTotal = item.totalParcelas;
                    const newTotal = atual - 1;
                    await state.db
                      .doc("income/" + id)
                      .update({ totalParcelas: newTotal });
                    await syncShareMirror("income", id, {
                      ...item,
                      totalParcelas: newTotal,
                    });
                    setUndo(
                      "Removido a partir de " + monthLabel(state.month) + ".",
                      async () => {
                        await state.db
                          .doc("income/" + id)
                          .update({ totalParcelas: oldTotal });
                        await syncShareMirror("income", id, item);
                      },
                    );
                  } else {
                    const snap = Object.assign({}, item);
                    delete snap.id;
                    await deleteShareMirror("income", item);
                    await state.db.doc("income/" + id).delete();
                    setUndo("Removido.", async () => {
                      await state.db.doc("income/" + id).set(snap);
                      await syncShareMirror("income", id, snap);
                    });
                  }
                } else if (
                  item &&
                  item.mesInicio &&
                  item.mesInicio < state.month
                ) {
                  const oldMesFim = item.mesFim || null;
                  const newMesFim = addMonths(state.month, -1);
                  await state.db
                    .doc("income/" + id)
                    .update({ mesFim: newMesFim });
                  await syncShareMirror("income", id, {
                    ...item,
                    mesFim: newMesFim,
                  });
                  setUndo(
                    "Removido a partir de " + monthLabel(state.month) + ".",
                    async () => {
                      await state.db
                        .doc("income/" + id)
                        .update({ mesFim: oldMesFim });
                      await syncShareMirror("income", id, item);
                    },
                  );
                } else if (item) {
                  await deleteFixedSeries("income", "income", item);
                }
                return;
              }
              const listKey = listFor[coll];
              const item = listKey
                ? state[listKey].find((x) => x.id === id)
                : null;
              const snap = item ? Object.assign({}, item) : null;
              if (snap) delete snap.id;
              if (coll === "installments") await deleteShareMirror(map[coll], item);
              await state.db.doc(map[coll] + "/" + id).delete();
              if (snap)
                setUndo("Removido.", async () => {
                  await state.db.doc(map[coll] + "/" + id).set(snap);
                  if (coll === "installments") {
                    await syncShareMirror(map[coll], id, snap);
                  }
                });
            });
          });
          root.querySelectorAll("[data-delcard]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const id = btn.dataset.delcard;
              const card = state.cards.find((c) => c.id === id);
              const txs = state.cardTx.filter((t) => t.cardId === id);
              const cardSnap = card ? Object.assign({}, card) : null;
              if (cardSnap) delete cardSnap.id;
              const txSnaps = txs.map((t) => {
                const s = Object.assign({}, t);
                delete s.id;
                return { id: t.id, data: s };
              });
              for (const t of txs) {
                await state.db.doc("cardTransactions/" + t.id).delete();
              }
              await state.db.doc("cards/" + id).delete();
              if (cardSnap) {
                setUndo("Cartão removido.", async () => {
                  await state.db.doc("cards/" + id).set(cardSnap);
                  for (const t of txSnaps) {
                    await state.db.doc("cardTransactions/" + t.id).set(t.data);
                  }
                });
              }
            });
          });

          // Limpar dados: apaga em massa os lançamentos dos módulos marcados, com
          // um passo de confirmação (não usa confirm() do navegador, pra ficar no
          // mesmo estilo do resto do app) e undo pelo mesmo mecanismo dos outros
          // apagamentos.
          root.querySelectorAll("[data-clearmod]").forEach((cb) => {
            cb.addEventListener("change", () => {
              state.clearSelected[cb.dataset.clearmod] = cb.checked;
              state.clearConfirm = false;
              renderViews();
            });
          });
          const clearAllToggle = root.querySelector("#clearAllToggle");
          if (clearAllToggle) {
            clearAllToggle.addEventListener("change", () => {
              CLEAR_MODULES.forEach((m) => {
                state.clearSelected[m.key] = clearAllToggle.checked;
              });
              state.clearConfirm = false;
              renderViews();
            });
          }
          const clearStartBtn = root.querySelector("[data-clearstart]");
          if (clearStartBtn) {
            clearStartBtn.addEventListener("click", () => {
              if (!CLEAR_MODULES.some((m) => state.clearSelected[m.key]))
                return;
              state.clearConfirm = true;
              renderViews();
            });
          }
          const clearCancelBtn = root.querySelector("[data-clearcancel]");
          if (clearCancelBtn) {
            clearCancelBtn.addEventListener("click", () => {
              state.clearConfirm = false;
              renderViews();
            });
          }
          const clearConfirmBtn = root.querySelector("[data-clearconfirm]");
          if (clearConfirmBtn) {
            clearConfirmBtn.addEventListener("click", async () => {
              const mods = CLEAR_MODULES.filter(
                (m) => state.clearSelected[m.key],
              );
              if (!mods.length) return;
              const snapshot = [];
              for (const m of mods) {
                for (const coll of m.collections) {
                  const items = state[clearStateKeyForColl[coll]] || [];
                  for (const item of items.slice()) {
                    const data = Object.assign({}, item);
                    delete data.id;
                    snapshot.push({ coll, id: item.id, data });
                    await state.db.doc(coll + "/" + item.id).delete();
                  }
                }
              }
              const count = snapshot.length;
              const labels = mods.map((m) => m.label).join(", ");
              state.clearSelected = {};
              state.clearConfirm = false;
              renderViews();
              if (count) {
                setUndo(
                  `${count} lançamento${count === 1 ? "" : "s"} apagado${count === 1 ? "" : "s"} (${labels}).`,
                  async () => {
                    for (const s of snapshot) {
                      await state.db.doc(s.coll + "/" + s.id).set(s.data);
                    }
                  },
                );
              }
            });
          }

          // Excluir conta: mesmo estilo de confirmação em dois passos do "Limpar
          // dados", mas sem undo (a conta de login em si é apagada de verdade).
          const delAccStartBtn = root.querySelector("[data-delaccstart]");
          if (delAccStartBtn) {
            delAccStartBtn.addEventListener("click", () => {
              state.deleteAccountConfirm = true;
              state.deleteAccountError = null;
              renderViews();
            });
          }
          const delAccCancelBtn = root.querySelector("[data-delacccancel]");
          if (delAccCancelBtn) {
            delAccCancelBtn.addEventListener("click", () => {
              state.deleteAccountConfirm = false;
              renderViews();
            });
          }
          const delAccConfirmBtn = root.querySelector("[data-delaccconfirm]");
          if (delAccConfirmBtn) {
            delAccConfirmBtn.addEventListener("click", async () => {
              state.deleteAccountBusy = true;
              state.deleteAccountError = null;
              renderViews();
              try {
                const { error } = await sb.rpc("delete_user");
                if (error) throw error;
                await sb.auth.signOut();
                location.reload();
              } catch (e) {
                state.deleteAccountBusy = false;
                state.deleteAccountError =
                  "Não foi possível excluir a conta: " +
                  (e && e.message ? e.message : "tente novamente.");
                renderViews();
              }
            });
          }

          const forms = {
            income: (fd) => {
              const tipoValor =
                fd.get("tipoValor") === "bruto" ? "bruto" : "liquido";
              const base = {
                nome: fd.get("nome"),
                mesInicio: fd.get("mesInicio"),
                recorrente: fd.get("recorrente") === "1",
                mesFim:
                  fd.get("recorrente") === "1" ? null : fd.get("mesInicio"),
                pessoa: null,
                tipoValor,
                seriesId: uid(),
              };
              if (tipoValor === "liquido") {
                return {
                  ...base,
                  valor: parseMoney(fd.get("valor")),
                  valorBruto: null,
                  inssCalc: null,
                  irpfCalc: null,
                  dependentes: null,
                };
              }
              const r = calcSalarioLiquido(
                parseMoney(fd.get("valor")),
                fd.get("dependentes"),
              );
              return {
                ...base,
                valor: r.liquido,
                valorBruto: r.bruto,
                inssCalc: r.inss,
                irpfCalc: r.irpf,
                dependentes: r.dependentes,
              };
            },
            incomeOther: (fd) => {
              const recorrente = fd.get("recorrente") === "1";
              const totalParcelasRaw = fd.get("totalParcelas");
              const totalParcelas = totalParcelasRaw
                ? Number(totalParcelasRaw)
                : null;
              const base = {
                nome: fd.get("nome"),
                valor: parseMoney(fd.get("valor")),
                mesInicio: fd.get("mesInicio"),
                pessoa: fd.get("pessoa"),
                seriesId: uid(),
              };
              return recorrente
                ? {
                    ...base,
                    totalParcelas: null,
                    recorrente: true,
                    mesFim: null,
                  }
                : {
                    ...base,
                    totalParcelas: totalParcelas || 1,
                    recorrente: false,
                    mesFim: null,
                  };
            },
            fixed: (fd) => ({
              nome: fd.get("nome"),
              mesInicio: fd.get("mesInicio"),
              mesFim: fd.get("recorrente") === "1" ? null : fd.get("mesInicio"),
              pessoa: null,
              seriesId: uid(),
              ...buildRateioFields(fd),
            }),
            fixedThird: (fd) => ({
              nome: fd.get("nome"),
              mesInicio: fd.get("mesInicio"),
              mesFim: fd.get("recorrente") === "1" ? null : fd.get("mesInicio"),
              pessoa: fd.get("pessoa"),
              seriesId: uid(),
              ...buildRateioFields(fd),
            }),
            installments: (fd) => ({
              nome: fd.get("nome"),
              pessoa: fd.get("pessoa") ? fd.get("pessoa").trim() : null,
              valorParcela: parseMoney(fd.get("valorParcela")),
              totalParcelas: Number(fd.get("totalParcelas")),
              mesInicio: fd.get("mesInicio"),
            }),
            cards: (fd) => ({
              nome: fd.get("nome"),
              limite: parseMoney(fd.get("limite")) || 0,
            }),
            cardTx: (fd) => {
              const recorrente = fd.get("recorrente") === "1";
              return {
                cardId: fd.get("cardId"),
                descricao: fd.get("descricao"),
                valorParcela: parseMoney(fd.get("valorParcela")),
                totalParcelas: recorrente
                  ? null
                  : Number(fd.get("totalParcelas")) || 1,
                mesInicio: fd.get("mesInicio"),
                recorrente,
                situacao: "aguardando",
              };
            },
            provisao: (fd) => ({
              nome: fd.get("nome"),
              valor: parseMoney(fd.get("valor")),
              mesInicio: fd.get("mesInicio"),
              mesFim: null,
              seriesId: uid(),
            }),
            compartilhamento: (fd) => ({
              terceiro: fd.get("terceiro"),
              email: fd.get("email").trim().toLowerCase(),
            }),
          };
          const collFor = {
            income: "income",
            incomeOther: "income",
            fixed: "fixedExpenses",
            fixedThird: "fixedExpenses",
            installments: "installments",
            cards: "cards",
            cardTx: "cardTransactions",
            provisao: "provisions",
            compartilhamento: "shares",
          };

          root.querySelectorAll("form[data-form]").forEach((form) => {
            form.addEventListener("submit", async (e) => {
              e.preventDefault();
              const key = form.dataset.form;
              const fd = new FormData(form);
              if (key === "displayName") {
                // Não é um lançamento — atualiza settings/general direto, não
                // passa pelo fluxo genérico de forms[key]/collFor[key].add().
                const name = (fd.get("displayName") || "").trim();
                await saveSettings({ displayName: name });
                renderUserName();
                return;
              }
              const data = forms[key](fd);
              const ref = await state.db.collection(collFor[key]).add(data);
              form.reset();
              if (
                key === "fixedThird" ||
                key === "incomeOther" ||
                key === "installments"
              ) {
                await syncShareMirror(collFor[key], ref.id, data);
              }
              if (key === "cards") {
                // A escuta da coleção 'cards' já pode ter disparado um render (com a
                // aba padrão) antes desta linha rodar — força reabrir na aba do
                // cartão recém-criado.
                state.tabs.cartoes = ref.id;
                renderViews();
              }
            });
          });

          // Edição de lançamentos já salvos: clicar no lápis troca a linha por um
          // formulário inline pré-preenchido; Salvar dá update() no documento (mescla
          // só os campos editados), Cancelar só sai do modo de edição sem tocar o banco.
          root.querySelectorAll("[data-editrow]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const [coll, id] = btn.dataset.editrow.split(":");
              state.editing = { coll, id };
              renderViews();
            });
          });
          root.querySelectorAll("[data-canceledit]").forEach((btn) => {
            btn.addEventListener("click", () => {
              state.editing = null;
              renderViews();
            });
          });
          const editForms = {
            // fixed/fixedThird/income/incomeOther não reaproveitam os builders de
            // criação aqui: aqueles sempre (re)setam mesInicio/mesFim/recorrente/
            // totalParcelas, campos estruturais que a edição não deve tocar — quem
            // decide o recorte de meses é saveFixedEditScoped. Só nome/valor
            // (e os campos de cálculo do salário, no caso da receita própria)
            // entram na edição.
            income: (fd) => {
              const tipoValor =
                fd.get("tipoValor") === "bruto" ? "bruto" : "liquido";
              if (tipoValor === "liquido") {
                return {
                  nome: fd.get("nome"),
                  valor: parseMoney(fd.get("valor")),
                  valorBruto: null,
                  inssCalc: null,
                  irpfCalc: null,
                  dependentes: null,
                  tipoValor,
                };
              }
              const r = calcSalarioLiquido(
                parseMoney(fd.get("valor")),
                fd.get("dependentes"),
              );
              return {
                nome: fd.get("nome"),
                valor: r.liquido,
                valorBruto: r.bruto,
                inssCalc: r.inss,
                irpfCalc: r.irpf,
                dependentes: r.dependentes,
                tipoValor,
              };
            },
            incomeOther: (fd) => ({
              nome: fd.get("nome"),
              valor: parseMoney(fd.get("valor")),
              pessoa: fd.get("pessoa"),
            }),
            fixed: (fd) => ({ nome: fd.get("nome"), ...buildRateioFields(fd) }),
            fixedThird: (fd) => ({
              nome: fd.get("nome"),
              pessoa: fd.get("pessoa"),
              ...buildRateioFields(fd),
            }),
            installments: forms.installments,
            // não reaproveita forms.cardTx aqui: aquele sempre reseta a situação para
            // "aguardando" na criação, o que apagaria um "verificado" já marcado.
            cardTx: (fd) => {
              const recorrente = fd.get("recorrente") === "1";
              return {
                cardId: fd.get("cardId"),
                descricao: fd.get("descricao"),
                valorParcela: parseMoney(fd.get("valorParcela")),
                totalParcelas: recorrente
                  ? null
                  : Number(fd.get("totalParcelas")) || 1,
                mesInicio: fd.get("mesInicio"),
                recorrente,
              };
            },
            provisao: (fd) => ({
              nome: fd.get("nome"),
              valor: parseMoney(fd.get("valor")),
            }),
          };
          root.querySelectorAll("form[data-editform]").forEach((form) => {
            form.addEventListener("submit", async (e) => {
              e.preventDefault();
              const [coll, id] = form.dataset.editid.split(":");
              const key = form.dataset.editform;
              const fd = new FormData(form);
              const data = editForms[key](fd);
              const scope =
                fd.get("editScope") === "forward" ? "forward" : "only";
              if (key === "fixed" || key === "fixedThird" || key === "provisao") {
                await saveFixedEditScoped(collFor[key], id, data, scope);
              } else if (key === "income" || key === "incomeOther") {
                const item = state.income.find((f) => f.id === id);
                if (item && item.totalParcelas) {
                  // Parcelamento (Outros com qtd. de parcelas): o valor vale para a
                  // compra inteira, não dá pra recortar por mês — aplica direto.
                  await state.db.doc(collFor[key] + "/" + id).update(data);
                  await syncShareMirror(
                    collFor[key],
                    id,
                    Object.assign({}, item, data),
                  );
                } else {
                  await saveFixedEditScoped("income", id, data, scope);
                }
              } else if (key === "installments") {
                const item = state.installments.find((f) => f.id === id);
                await state.db.doc(collFor[key] + "/" + id).update(data);
                await syncShareMirror(
                  collFor[key],
                  id,
                  Object.assign({}, item, data),
                );
              } else {
                await state.db.doc(collFor[key] + "/" + id).update(data);
              }
              state.editing = null;
              renderViews();
            });
          });

          root.querySelectorAll("form.js-income-form").forEach((form) => {
            const valorInput = form.querySelector(".js-valor");
            const depInput = form.querySelector(".js-dep-input");
            const tipoCheck = form.querySelector(".js-tipo-check");
            const depWrap = form.querySelector(".js-dep-wrap");
            if (!valorInput) return;
            const preview =
              form.parentElement.querySelector(":scope > .js-calc-preview") ||
              form.querySelector(".js-calc-preview");
            const isLiquido = () => tipoCheck && !tipoCheck.checked;
            const updatePreview = () => {
              if (!preview) return;
              if (isLiquido() || !valorInput.value) {
                preview.hidden = true;
                return;
              }
              const r = calcSalarioLiquido(
                parseMoney(valorInput.value),
                depInput ? depInput.value : 0,
              );
              preview.hidden = false;
              preview.innerHTML = `Bruto ${money(r.bruto)} − INSS ${money(r.inss)} − IRPF ${money(r.irpf)} = <b>líquido ${money(r.liquido)}</b> <span class="meta">(tabelas INSS/IRPF 2026${r.dependentes ? ", " + r.dependentes + " dependente(s)" : ""})</span>`;
            };
            const syncTipo = () => {
              if (depWrap) depWrap.hidden = isLiquido();
              updatePreview();
            };
            valorInput.addEventListener("input", updatePreview);
            if (depInput) depInput.addEventListener("input", updatePreview);
            if (tipoCheck) tipoCheck.addEventListener("change", syncTipo);
            syncTipo();
          });

          root.querySelectorAll("form.js-outros-form").forEach((form) => {
            const check = form.querySelector(".js-recorrente-check");
            if (!check) return;
            const wrap = form.querySelector(".js-parcelas-wrap");
            const inicioWrap = form.querySelector(".js-mesInicio-wrap");
            const valorLabel = form.querySelector(".js-valor-label");
            const parcelasInput = wrap
              ? wrap.querySelector('input[name="totalParcelas"]')
              : null;
            const sync = () => {
              if (wrap) {
                wrap.hidden = check.checked;
                if (parcelasInput) parcelasInput.required = !check.checked;
              }
              if (inicioWrap) inicioWrap.hidden = check.checked;
              if (valorLabel)
                valorLabel.textContent = check.checked
                  ? "Valor"
                  : "Valor da parcela";
            };
            check.addEventListener("change", sync);
            sync();
          });

          // Rateio de despesa fixa: reaproveitado tanto no form de criação quanto
          // no de edição (fixedEditForm) — mostra CT/CP só quando marcado, com
          // preview ao vivo de valorAPagar = (valorTotal/CT)*CP.
          root.querySelectorAll("form.js-rateio-form").forEach((form) => {
            const check = form.querySelector(".js-rateio-check");
            if (!check) return;
            const ctWrap = form.querySelector(".js-cotasTotais-wrap");
            const cpWrap = form.querySelector(".js-cotasPagas-wrap");
            const ctInput = ctWrap
              ? ctWrap.querySelector('input[name="cotasTotais"]')
              : null;
            const cpInput = cpWrap
              ? cpWrap.querySelector('input[name="cotasPagas"]')
              : null;
            const valorInput = form.querySelector(".js-valor");
            const valorLabel = form.querySelector(".js-valor-label");
            const preview =
              form.parentElement.querySelector(":scope > .js-calc-preview") ||
              form.querySelector(".js-calc-preview");
            const updatePreview = () => {
              if (!preview) return;
              if (
                !check.checked ||
                !valorInput ||
                !valorInput.value ||
                !ctInput ||
                !ctInput.value ||
                !cpInput ||
                !cpInput.value
              ) {
                preview.hidden = true;
                return;
              }
              const valorTotal = parseMoney(valorInput.value);
              const ct = Number(ctInput.value) || 0;
              const cp = Number(cpInput.value) || 0;
              if (!ct) {
                preview.hidden = true;
                return;
              }
              const valorPagar = Math.round((valorTotal / ct) * cp * 100) / 100;
              preview.hidden = false;
              preview.innerHTML = `${money(valorTotal)} ÷ ${ct} cotas × ${cp} = <b>${money(valorPagar)} a pagar</b>`;
            };
            const sync = () => {
              const on = check.checked;
              if (ctWrap) {
                ctWrap.hidden = !on;
                if (ctInput) ctInput.required = on;
              }
              if (cpWrap) {
                cpWrap.hidden = !on;
                if (cpInput) cpInput.required = on;
              }
              if (valorLabel)
                valorLabel.textContent = on ? "Valor total" : "Valor";
              updatePreview();
            };
            check.addEventListener("change", sync);
            if (valorInput) valorInput.addEventListener("input", updatePreview);
            if (ctInput) ctInput.addEventListener("input", updatePreview);
            if (cpInput) cpInput.addEventListener("input", updatePreview);
            sync();
          });
        }

        function debounce(fn, ms) {
          let t;
          return (...a) => {
            clearTimeout(t);
            t = setTimeout(() => fn(...a), ms);
          };
        }

        window.addEventListener("resize", () => {
          document.documentElement.style.setProperty(
            "--topbar-h",
            document.getElementById("topbar").offsetHeight + "px",
          );
        });
        document.getElementById("menuToggle").addEventListener("click", () => {
          const sidebarEl = document.getElementById("sidebar");
          setSidebarOpen(!sidebarEl.classList.contains("open"));
        });
        document
          .getElementById("sidebarBackdrop")
          .addEventListener("click", () => setSidebarOpen(false));
        // Se a tela for redimensionada de volta pro layout de desktop
        // enquanto a gaveta está aberta, fecha — acima de 860px a barra
        // lateral some do modo "gaveta" e volta a ficar sempre visível
        // (ver CSS), então não faz sentido continuar marcada como aberta.
        window.addEventListener("resize", () => {
          if (window.innerWidth > 860) setSidebarOpen(false);
        });
        document.getElementById("prevMonth").addEventListener("click", () => {
          state.month = addMonths(state.month, -1);
          watchMonth(state.month);
          renderAll();
        });
        document.getElementById("nextMonth").addEventListener("click", () => {
          state.month = addMonths(state.month, 1);
          watchMonth(state.month);
          renderAll();
        });
        document
          .getElementById("rascunhoToggle")
          .addEventListener("change", (e) => {
            state.rascunho = e.target.checked;
            if (!state.rascunho) {
              state.rascunhoOut = {};
              state.rascunhoValores = {};
              state.rascunhoPrevValores = {};
            }
            renderAll();
          });
        document.getElementById("gotoToday").addEventListener("click", () => {
          state.month = todayKey();
          watchMonth(state.month);
          renderAll();
        });
        document.getElementById("themeToggle").addEventListener("click", () => {
          applyTheme(currentEffectiveTheme() === "dark" ? "light" : "dark");
        });
        document
          .getElementById("undoToastBtn")
          .addEventListener("click", async () => {
            if (!state.undo) return;
            const run = state.undo.run;
            state.undo = null;
            clearTimeout(undoTimer);
            renderUndoToast();
            await run();
          });

        // Popup de nome de exibição (ver maybeShowNamePrompt em bootApp) —
        // enquanto o nome não for salvo, volta a aparecer em todo login.
        // "Salvar" grava o nome (só some de vez se vier preenchido); "Agora
        // não" só fecha o popup desta vez, sem gravar nada — reaparece no
        // próximo login.
        document
          .getElementById("nameForm")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("nameInput");
            const name = (input.value || "").trim();
            await saveSettings({ displayName: name });
            document.getElementById("nameModal").hidden = true;
            renderUserName();
          });
        document.getElementById("nameSkipBtn").addEventListener("click", () => {
          document.getElementById("nameModal").hidden = true;
        });

        /* ============================================================
     6. Render raiz
  ============================================================ */
        function renderAll() {
          renderNav();
          renderTopbar();
          renderTiles();
          renderViews();
        }

        renderNav();
        renderTopbar();
        initAuth();
      })();
    </script>
  </body>
</html>
